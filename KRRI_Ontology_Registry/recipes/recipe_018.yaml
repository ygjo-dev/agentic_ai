steps:

  - node: point

  - node: find_admin_boundary_by_point

execution:

  spoken_needed: false

  context_needs:
    point: {from: context.selectedLocation, fields: {lon: lon, lat: lat}}

  workflow:

    - id: s1
      node: find_admin_boundary_by_point
      server_id: asap-mcp-core
      tool: adminBoundary.findBoundaryByPoint
      input:
        lon: {from: context.point.lon}
        lat: {from: context.point.lat}
        layer: {from: spoken.admin_level, default: 시군구, map: {시도: sido, 시군구: sigungu, 읍면동: emd}}
