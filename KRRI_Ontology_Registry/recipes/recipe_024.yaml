steps:

  - node: map_extent

  - node: search_admin_boundaries

example: 지금 화면에 든 시군구 경계선 표시해줘

execution:

  spoken_needed: false

  context_needs:
    map_extent: {from: context.view.bbox, fields: {minLon: '0.0', minLat: '0.1', maxLon: '1.0', maxLat: '1.1'}}

  workflow:

    - id: s1
      node: search_admin_boundaries
      server_id: asap-mcp-core
      tool: adminBoundary.searchBoundaries
      input:
        bbox: [{from: context.map_extent.minLon}, {from: context.map_extent.minLat}, {from: context.map_extent.maxLon}, {from: context.map_extent.maxLat}]
        layer: {from: spoken.admin_level, default: 시군구, map: {시도: sido, 시군구: sigungu, 읍면동: emd}}
