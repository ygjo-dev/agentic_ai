steps:

  - node: place_name

  - node: geocode_place

  - node: point_to_map_extent

  - node: search_ev_stations

  - node: get_ev_station

example: 대전역 옆 충전소 충전기 몇 개 비었는지까지 줘

execution:

  spoken_needed: true

  context_needs: {}

  workflow:

    - id: s1
      node: geocode_place
      server_id: asap-mcp-core
      tool: geo.geocode
      input:
        query: {from: spoken.argument}
      outputs:
        point: {fields: {lon: location.0, lat: location.1}}

    - id: s2
      node: search_ev_stations
      server_id: asap-mcp-core
      tool: ev.searchStations
      transform:
        id: builtin/geo.pointRadiusToBbox
        node: point_to_map_extent
        input:
          center: [{from: s1.point.lon}, {from: s1.point.lat}]
          radiusMeters: {value: 15000}
      input:
        minLon: {from: transform.map_extent.minLon}
        minLat: {from: transform.map_extent.minLat}
        maxLon: {from: transform.map_extent.maxLon}
        maxLat: {from: transform.map_extent.maxLat}
      outputs:
        station_id: {value: items.0.stationId}

    - id: s3
      node: get_ev_station
      server_id: asap-mcp-core
      tool: ev.getStation
      input:
        statId: {from: s2.station_id}
