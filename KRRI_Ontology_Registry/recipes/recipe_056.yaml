steps:

  - node: map_extent

  - node: search_ev_stations

  - node: get_ev_station

execution:

  spoken_needed: false

  context_needs:
    map_extent: {from: context.view.bbox, fields: {minLon: '0.0', minLat: '0.1', maxLon: '1.0', maxLat: '1.1'}}

  workflow:

    - id: s1
      node: search_ev_stations
      server_id: asap-mcp-core
      tool: ev.searchStations
      input:
        minLon: {from: context.map_extent.minLon}
        minLat: {from: context.map_extent.minLat}
        maxLon: {from: context.map_extent.maxLon}
        maxLat: {from: context.map_extent.maxLat}
      outputs:
        station_id: {value: items.0.stationId}

    - id: s2
      node: get_ev_station
      server_id: asap-mcp-core
      tool: ev.getStation
      input:
        statId: {from: s1.station_id}
