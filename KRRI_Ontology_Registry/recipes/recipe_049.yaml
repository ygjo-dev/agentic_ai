steps:

  - node: place_name

  - node: get_railway_section

  - node: find_cctv

example: 호남선 선로 따라 CCTV 띄워줘

execution:

  spoken_needed: true

  context_needs: {}

  workflow:

    - id: s1
      node: get_railway_section
      server_id: asap-mcp-core
      tool: rail.getSectionGeometry
      input:
        sectionName: {from: spoken.argument}
      outputs:
        map_extent: {fields: {minLon: bbox.0.0, minLat: bbox.0.1, maxLon: bbox.1.0, maxLat: bbox.1.1}}

    - id: s2
      node: find_cctv
      server_id: asap-mcp-core
      tool: road.getCctv
      input:
        minLon: {from: s1.map_extent.minLon}
        minLat: {from: s1.map_extent.minLat}
        maxLon: {from: s1.map_extent.maxLon}
        maxLat: {from: s1.map_extent.maxLat}
