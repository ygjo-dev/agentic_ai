steps:

  - node: point

  - node: point_to_map_extent

  - node: find_cctv

example: 이 위치 둘레 CCTV 보여줘

execution:

  spoken_needed: false

  context_needs:
    point: {from: context.selectedLocation, fields: {lon: lon, lat: lat}}

  workflow:

    - id: s1
      node: find_cctv
      server_id: asap-mcp-core
      tool: road.getCctv
      transform:
        id: builtin/geo.pointRadiusToBbox
        node: point_to_map_extent
        input:
          center: [{from: context.point.lon}, {from: context.point.lat}]
          radiusMeters: {value: 15000}
      input:
        minLon: {from: transform.map_extent.minLon}
        minLat: {from: transform.map_extent.minLat}
        maxLon: {from: transform.map_extent.maxLon}
        maxLat: {from: transform.map_extent.maxLat}
