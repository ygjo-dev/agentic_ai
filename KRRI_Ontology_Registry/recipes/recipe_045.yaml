steps:

  - node: place_name

  - node: geocode_place

  - node: search_population_statistics

example: 대전역 주변에 사람 몇 명이나 사나

execution:

  spoken_needed: true

  context_needs: {}

  workflow:

    - id: s1
      node: geocode_place
      server_id: asap-mcp-core
      tool: geo.geocode
      input:
        query: {from: spoken.argument}
      outputs:
        map_extent: {fields: {minLon: bbox.0.0, minLat: bbox.0.1, maxLon: bbox.1.0, maxLat: bbox.1.1}}

    - id: s2
      node: search_population_statistics
      server_id: asap-mcp-core
      tool: population.searchStatistics
      input:
        bbox: [{from: s1.map_extent.minLon}, {from: s1.map_extent.minLat}, {from: s1.map_extent.maxLon}, {from: s1.map_extent.maxLat}]
