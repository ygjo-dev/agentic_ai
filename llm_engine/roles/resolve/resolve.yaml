# resolve — 발화 → recipe 선택. 같은 응답에서 발화가 말한 값도 함께 뽑는다.
#
# 이 파일 하나가 logical model 한 판이다. 물리 모델 · provider · inference 설정 ·
# prompt 판 · response schema 판 중 하나라도 뜻을 갖고 바꾸면 version 을 올린다.
# prompt 와 schema 는 이 폴더의 prompts/v<N>.yaml · response_schemas/v<N>.yaml 이다.
#
# ★ LLM 호출은 한 번이다. 고르기와 뽑기를 두 번으로 나누지 않는다.
# ★ 어디에 붙는가(VLLM_URL)는 기계마다 다르므로 .env 에 있다. 여기 적지 않는다.
role: resolve
version: 1

model:
  # Solar Open2 250B NVFP4. 고른 까닭은 NOTES 2026-09-06 기록에 있다.
  # ★ 서버가 --no-enable-flashinfer-autotune 으로 떠 있어야 같은 발화가 같은
  #   답을 낸다. 그것은 서버 기동 옵션이라 여기 없다.
  provider: vllm
  name: solar-open2-250b

inference:
  # 호출 하나의 상한(초).
  # num_ctx 가 없다. vLLM 의 컨텍스트는 서버가 뜰 때 --max-model-len 으로 정한다.
  timeout: 180

prompt_version: 1
response_schema_version: 1
