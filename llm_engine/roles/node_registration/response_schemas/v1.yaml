# node_registration 응답 구조(JSON Schema).
#
# node_id 형식(소문자 영문과 언더스코어)은 여기서 강제하지 않는다. 등록 도메인
# (registration/registry.py 의 NODE_ID_PATTERN)이 받은 뒤에 다시 검증한다.
type: object
properties:
  node_id:
    type: string
  # 관한 대상(그룹) 노드 id 들. 여러 개 고를 수 있다 — 승강장 CCTV 영상이
  # 승강장에도 CCTV 에도 관한 것처럼. 어느 대상에도 매이지 않으면 빈 목록.
  groups:
    type: array
    items:
      type: string
  reason:
    type: string
required:
  - node_id
  - groups
  - reason
