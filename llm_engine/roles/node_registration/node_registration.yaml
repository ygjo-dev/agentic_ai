# node_registration — 사람이 쓴 노드 정보 → node_id 와 관한 대상.
#
# 이 파일 하나가 logical model 한 판이다. 물리 모델 · provider · inference 설정 ·
# prompt 판 · response schema 판 중 하나라도 뜻을 갖고 바꾸면 version 을 올린다.
# prompt 와 schema 는 이 폴더의 prompts/v<N>.yaml · response_schemas/v<N>.yaml 이다.
#
# resolve 와 목적도 프롬프트도 다르므로 한 역할로 합치지 않는다.
# ★ 어디에 붙는가(OLLAMA_URL)는 기계마다 다르므로 .env 에 있다. 여기 적지 않는다.
role: node_registration
version: 1

model:
  provider: ollama
  name: "qwen3:32b"

inference:
  # 요청마다 싣는 컨텍스트 크기(토큰). 이 장비는 VRAM 95GB x4 라 여유가 있다.
  num_ctx: 32768
  # 호출 하나의 상한(초). 32b 는 작은 모델의 기본 180초를 넘긴다.
  timeout: 900

prompt_version: 1
response_schema_version: 1
