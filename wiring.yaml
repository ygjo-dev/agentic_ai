# 배선표. 노드를 무엇으로 실행하고 input 을 어떻게 채우는지.
#
# **온톨로지가 아니다. 온톨로지 옆이다.** 온톨로지는 무엇을 어떤 순서로 하는지만
# 말하고 도구 이름을 모른다. 노드가 특정 MCP 서버에 묶이면 같은 일을 하는 도구로
# 갈아끼울 때 도메인을 고쳐야 하고, 「노드에는 name 과 description 만」이라는
# 원칙과 부딪히고, menu 가 온톨로지에서 만들어지므로 도구 이름이 프롬프트로 샐
# 자리가 가까워진다. 그래서 ontology/ 안에 넣지 않고 models.yaml 옆에 둔다.
#
# 왜 데이터로 뺐나. 노드를 등록하면 recipe 는 저절로 느는데 배선은 사람이 코드에
# 적어야 했다. tools/check_wiring.py 가 그 격차를 「C 부류」로 센다.
#
# 두 절이다.
#
#   tool_of   노드            -> 실행 수단(server_id + tool 또는 command) · 답 첫 줄
#   step_of   (노드, 받는 타입) -> input
#
# **step_of 는 두 겹이다.** 키가 (노드, 받는 타입) 짝인데 YAML 은 짝을 키로 쓸 수
# 없다. 바깥이 노드이고 안이 받는 타입이다. 로더가 그 둘을 짝으로 묶는다.
# 같은 노드가 두 자리에 오고 받는 것이 달라서 짝이어야 한다 — 전기차 충전소
# 검색은 말한 키워드 뒤에도 오고(query) 장소 좌표 변환 뒤에도 온다(center).
#
# **< > 는 「값은 코드에 있다」는 표시다.** 그 이름을 로더가 코드의 값으로 바꿔
# 넣고, 모르는 이름이 오면 조용히 넘기지 않고 터진다. 값을 여기 옮겨 적으면
# 원천이 둘이 되는 것들이다 — <RADIUS_METERS> 는 demo/ui/config.py 도 쓰고,
# <POINT_RADIUS_TO_BBOX> 는 vendor 어댑터의 이름이고, <RAILWAY_LINE_SUFFIX> 는
# 값 판단의 자라 뜻이 코드에 있어야 한다.
#
# 줄마다의 실측 근거(응답 전문 · 몇 건이 나왔나 · 왜 이 칸인가)는 아직
# demo/api/services/step_service.py 의 주석에 있다. 1-b 에서 옛 표를 지울 때
# 함께 옮긴다. 지금 옮기면 같은 글이 두 곳에 있게 된다.


# 되풀이되는 값. 한 곳에만 적고 아래에서 가리킨다 — 줄마다 베껴 적으면 한 곳만
# 고쳤을 때 조용히 어긋난다.
#
# $prev 와 $context 로 시작하는 이름은 낱개로도 묶는다. 같은 네 칸이 목록 꼴
# (bbox 한 칸)과 평평한 넷 꼴 둘 다로 쓰이는데 YAML 은 앵커를 인덱스할 수 없어
# 낱개를 안 묶으면 같은 문자열을 두 번 적게 된다.
anchors:

  # 마흔은 여기, web.search 하나만 다른 서버다. tools.json 의 serverId 가 근거다.
  server_id: &server_id "asap-mcp-core"

  # 발화에서 온 값을 가리키는 표시. 장소인지 키워드인지 식별자인지는 안 가른다.
  spoken_value: &arg "@arg"

  # 앞 단계가 내놓은 것.
  prev_min_lon: &prev_min_lon "$prev.minLon"
  prev_min_lat: &prev_min_lat "$prev.minLat"
  prev_max_lon: &prev_max_lon "$prev.maxLon"
  prev_max_lat: &prev_max_lat "$prev.maxLat"
  bbox_from_previous: &bbox_from_previous
    - *prev_min_lon
    - *prev_min_lat
    - *prev_max_lon
    - *prev_max_lat
  point_from_previous: &point_from_previous
    lon: "$prev.lon"
    lat: "$prev.lat"
  location_from_previous: &location_from_previous "$prev.location"
  admin_level_from_previous: &admin_level_from_previous
    level: "$prev.items.1.layerId"
    code: "$prev.items.1.code"

  # 저쪽 화면이 발화와 함께 보내는 지도 문맥. @arg 도 $prev 도 아닌 셋째 자리다.
  view_min_lon: &view_min_lon "$context.view.minLon"
  view_min_lat: &view_min_lat "$context.view.minLat"
  view_max_lon: &view_max_lon "$context.view.maxLon"
  view_max_lat: &view_max_lat "$context.view.maxLat"
  bbox_from_context: &bbox_from_context
    - *view_min_lon
    - *view_min_lat
    - *view_max_lon
    - *view_max_lat
  selected_location: &selected_location "$context.selectedLocation"
  point_from_context: &point_from_context
    lon: "$context.selectedLocation.lon"
    lat: "$context.selectedLocation.lat"


# 노드 -> 실행 수단 · 답 첫 줄.
#
# **한 노드는 한 도구이고 한 headline 이다.** 받는 것이 둘이어도 부르는 도구는
# 같다. 그래서 이 절은 노드당 한 줄이고 step_of 만 두 겹이다.
tool_of:

  geocode_place:
    server_id: *server_id
    tool: geo.geocode
    headline: "{arg} 좌표를 조회했습니다."

  find_cctv:
    server_id: *server_id
    tool: road.getCctv
    headline: "{arg} CCTV 를 조회했습니다."

  get_railway_section:
    server_id: *server_id
    tool: rail.getSectionGeometry
    headline: "{arg} 철도 구간 형상을 조회했습니다."

  get_railway_lines:
    server_id: *server_id
    tool: geo.getRailwayLines
    headline: "{arg} 철도 노선을 조회했습니다."

  find_admin_boundary_by_point:
    server_id: *server_id
    tool: adminBoundary.findBoundaryByPoint
    headline: "{arg} 행정구역을 조회했습니다."

  find_election_district_by_point:
    server_id: *server_id
    tool: election.findDistrictByPoint
    headline: "{arg} 국회의원 지역구를 조회했습니다."

  find_assembly_district_by_point:
    server_id: *server_id
    tool: election.findAssemblyDistrictByPoint
    headline: "{arg} 국회의원 전체 선거구를 조회했습니다."

  find_assembly_pledge_district_by_point:
    server_id: *server_id
    tool: election.findAssemblyPledgeDistrictByPoint
    headline: "{arg} 국회의원 선거구 공약을 조회했습니다."

  find_local_pledge_summary_by_point:
    server_id: *server_id
    tool: election.findLocalPledgeSummaryByPoint
    headline: "{arg} 지방선거 교통 공약을 조회했습니다."

  search_admin_boundaries:
    server_id: *server_id
    tool: adminBoundary.searchBoundaries
    headline: "{arg} 행정구역 경계를 조회했습니다."

  get_vworld_boundaries:
    server_id: *server_id
    tool: vworld.getAdministrativeBoundaries
    headline: "{arg} VWorld 행정경계를 조회했습니다."

  search_population_statistics:
    server_id: *server_id
    tool: population.searchStatistics
    headline: "{arg} 인구 통계를 조회했습니다."

  get_age_profile:
    server_id: *server_id
    tool: population.getAgeProfile
    headline: "{arg} 연령대별 인구 구성을 조회했습니다."

  get_population_trend:
    server_id: *server_id
    tool: population.getTrend
    headline: "{arg} 인구 변화 추이를 조회했습니다."

  search_ev_stations:
    server_id: *server_id
    tool: ev.searchStations
    headline: "{arg} 전기차 충전소를 조회했습니다."

  get_ev_station:
    server_id: *server_id
    tool: ev.getStation
    headline: "{arg} 충전소 상세를 조회했습니다."

  search_election_districts:
    server_id: *server_id
    tool: election.searchDistricts
    headline: "{arg} 국회의원 지역구 목록을 조회했습니다."

  search_assembly_districts:
    server_id: *server_id
    tool: election.searchAssemblyDistricts
    headline: "{arg} 국회의원 전체 선거구 목록을 조회했습니다."

  search_assembly_pledge_districts:
    server_id: *server_id
    tool: election.searchAssemblyPledgeDistricts
    headline: "{arg} 국회의원 선거구 공약 목록을 조회했습니다."

  search_local_pledge_summaries:
    server_id: *server_id
    tool: election.searchLocalPledgeSummaries
    headline: "{arg} 지방선거 교통 공약 목록을 조회했습니다."

  # 선거 상세 넷. 목록 검색(search_…)과 짝이고 하나를 집어 오는 쪽이다.
  get_election_district:
    server_id: *server_id
    tool: election.getDistrict
    headline: "{arg} 국회의원 지역구를 조회했습니다."

  get_assembly_district:
    server_id: *server_id
    tool: election.getAssemblyDistrict
    headline: "{arg} 국회의원 전체 선거구를 조회했습니다."

  get_assembly_pledge_district:
    server_id: *server_id
    tool: election.getAssemblyPledgeDistrict
    headline: "{arg} 국회의원 선거구 공약을 조회했습니다."

  get_local_pledge_summary:
    server_id: *server_id
    tool: election.getLocalPledgeSummary
    headline: "{arg} 지방선거 교통 공약 요약을 조회했습니다."

  search_documents:
    server_id: *server_id
    tool: knowledge.query
    headline: "{arg} 문서를 조회했습니다."

  # web.search 만 다른 서버다. 한 줄뿐이라 앵커로 묶지 않는다.
  web_search:
    server_id: "web-search"
    tool: web.search
    headline: "{arg} 웹 검색 결과를 조회했습니다."

  # **도구가 아닌 유일한 줄이다.** server_id · tool 대신 command 를 적는다.
  # 한 줄에 둘 다 적지 않는다 — 도구도 부르고 명령도 내는 노드가 생기면 그때
  # 다시 정한다.
  show_facility:
    command: digitalTwin.showFacility
    headline: "{arg} 시설물을 화면에 띄웠습니다."


# (노드, 받는 타입) -> 그 자리에서 input 을 어떻게 채우는가.
#
#   input        그 도구가 받는 input. @arg 와 $prev 를 쓸 수 있다
#   input_first  앞 단계가 없을 때의 input. 안 적으면 input 을 그대로 씀.
#                저쪽 화면의 지도 문맥이 들어오는 자리다
#   adapter      vendor 입력 어댑터 이름. 저절로 안 걸리는 도구에만 적는다
#   arg_field    [어미, 칸 이름]. 발화에서 온 값이 그 어미로 끝나면 @arg 가 든
#                칸의 이름을 그것으로 바꾼다. 값 판단이 배선표에 들어오는
#                유일한 칸이다
#
# **받는 타입은 온톨로지의 hasInput 선언과 1:1 이다.** 선언에 없는 타입으로 줄을
# 적으면 plan 이 그 줄을 영영 못 고르고, 선언에는 있는데 줄이 없으면 그 자리는
# unwired 다. tools/check_wiring.py 가 양쪽을 센다.
step_of:

  geocode_place:
    place_name:
      input: {query: *arg}

  find_cctv:
    # road.getCctv 는 bbox 넷이 전부 required 라 vendor 가 어댑터를 저절로 건다.
    map_extent:
      input:
        minLon: *prev_min_lon
        minLat: *prev_min_lat
        maxLon: *prev_max_lon
        maxLat: *prev_max_lat
      input_first:
        minLon: *view_min_lon
        minLat: *view_min_lat
        maxLon: *view_max_lon
        maxLat: *view_max_lat
    point:
      input: {location: *location_from_previous, radiusMeters: "<RADIUS_METERS>"}
      input_first: {location: *selected_location, radiusMeters: "<RADIUS_METERS>"}

  get_railway_section:
    place_name:
      input: {sectionName: *arg}

  get_railway_lines:
    # 역명으로 볼지 노선명으로 볼지를 값이 정한다. 둘을 함께 보내는 길은 닫혀
    # 있다 — 저쪽이 두 절을 AND 로 이어서 같은 값이면 0건이다.
    place_name:
      input: {stationName: *arg}
      arg_field: ["<RAILWAY_LINE_SUFFIX>", railwayName]
    map_extent:
      input: {bbox: *bbox_from_previous}
      input_first: {bbox: *bbox_from_context}

  find_admin_boundary_by_point:
    point:
      input: *point_from_previous
      input_first: *point_from_context

  find_election_district_by_point:
    point:
      input: *point_from_previous
      input_first: *point_from_context

  find_assembly_district_by_point:
    point:
      input: *point_from_previous
      input_first: *point_from_context

  find_assembly_pledge_district_by_point:
    point:
      input: *point_from_previous
      input_first: *point_from_context

  find_local_pledge_summary_by_point:
    point:
      input: *point_from_previous
      input_first: *point_from_context

  search_admin_boundaries:
    keyword:
      input: {query: *arg}
    map_extent:
      input: {bbox: *bbox_from_previous}
      input_first: {bbox: *bbox_from_context}

  get_vworld_boundaries:
    keyword:
      input: {query: *arg}
    map_extent:
      input: {bbox: *bbox_from_previous}
      input_first: {bbox: *bbox_from_context}

  search_population_statistics:
    keyword:
      input: {query: *arg}
    map_extent:
      input: {bbox: *bbox_from_previous}
      input_first: {bbox: *bbox_from_context}

  # 인구 두 도구는 자리가 하나다. 앞 단계는 지점 행정구역 판별뿐이다.
  get_age_profile:
    admin_code:
      input: *admin_level_from_previous

  get_population_trend:
    admin_code:
      input: *admin_level_from_previous

  search_ev_stations:
    keyword:
      input: {query: *arg}
    # bbox 넷이 전부 optional 이라 vendor 가 어댑터를 저절로 안 건다. 그래서 이
    # 줄에만 이름을 적는다. 첫 자리에는 어댑터를 안 건다 — 보이는 범위는 이미
    # 사각형이고, 이 도구는 bbox 를 평평한 네 수로 받는다.
    map_extent:
      input: {center: *location_from_previous, radiusMeters: "<RADIUS_METERS>"}
      adapter: "<POINT_RADIUS_TO_BBOX>"
      input_first:
        minLon: *view_min_lon
        minLat: *view_min_lat
        maxLon: *view_max_lon
        maxLat: *view_max_lat

  # statId 는 stationId 이지 id 가 아니다(실측).
  get_ev_station:
    station_id:
      input: {statId: "$prev.items.0.stationId"}

  search_election_districts:
    keyword:
      input: {query: *arg}

  search_assembly_districts:
    keyword:
      input: {query: *arg}
    map_extent:
      input: {bbox: *bbox_from_previous}
      input_first: {bbox: *bbox_from_context}

  search_assembly_pledge_districts:
    keyword:
      input: {query: *arg}
    map_extent:
      input: {bbox: *bbox_from_previous}
      input_first: {bbox: *bbox_from_context}

  # 선거 상세 셋 : 말한 이름을 그대로 보낸다. 넷 다 code 말고 이름 칸을 따로 갖는다.
  get_election_district:
    district_code:
      input: {name: *arg}

  get_assembly_district:
    district_code:
      input: {name: *arg}

  get_assembly_pledge_district:
    district_code:
      input: {name: *arg}

  # 경로는 둘인데 앞 노드는 둘 다 지점 행정구역 판별이라 줄은 하나다.
  # items.0 이 시도이고 그 code 가 두 자리 시도 코드다.
  get_local_pledge_summary:
    admin_code:
      input: {sidoCode: "$prev.items.0.code"}

  # 아래 둘은 배선이 맞는데 도구 쪽이 지금 비어 있다. 배선이 없는 것과 데이터가
  # 없는 것은 다르므로 적어 둔다.
  search_local_pledge_summaries:
    keyword:
      input: {query: *arg}
    map_extent:
      input: {bbox: *bbox_from_previous}
      input_first: {bbox: *bbox_from_context}

  # k 는 돌려받을 조각 수다. 6 인 근거는 실측이고 step_service.py 주석에 있다.
  search_documents:
    keyword:
      input: {query: *arg, k: 6}

  # web.search : 우리 user_context 에 web-search 서버가 안 열려 있다.
  web_search:
    keyword:
      input: {query: *arg}

  # 이 input 은 도구 인자가 아니라 지도 명령의 args 다. 칸 이름은 저쪽 화면이
  # 읽는 이름 그대로여야 한다.
  show_facility:
    place_name:
      input: {facilityName: *arg}
