# 구조 원칙
# - 노드 필드는 name / description / inputs / outputs / properties(선택) 다섯 개다.
# - 노드는 그룹 없이 평평하게 둔다. data/transfer/action 구분은 inputs/outputs 에서
#   계산되므로 중복이고, 중첩 구조는 노드 id 중복을 YAML 이 잡아주지 못한다.
# - 노드 간 관계(near 등)는 파일에 적지 않는다. 읽는 쪽(시각화, 조회)이 계산한다.
# - properties 에는 인터페이스로 표현되지 않는 것만 적는다.
#   modality(video/image)나 category(data/transfer/action)는 inputs/outputs 에서
#   유도되므로 넣지 않는다.
# - properties 의 value 는 시각화 라벨에 그대로 노출되므로
#   코드값이 아니라 사람이 읽는 단어로 쓴다.
#
# 사용 중인 property key
# - subject : 이 노드가 다루는 대상. 같은 값을 가진 노드끼리 관계(점선)로 이어진다.
#             지금 쓰이는 값 : 승강장 · 궤도 · 기상
#             어느 대상에도 매이지 않는 범용 노드는 비운다.
#
#   key 를 하나로 둔 이유 : 예전에는 source / site / target / output_kind / format
#   다섯 개를 썼는데, key 가 노드 종류에 묶여 있어 관계가 끊겼다. 불러오기는
#   site, 분석은 target 을 써서 같은 "승강장" 인데도 점선이 안 생겼다.
#   대상을 묻는 key 하나로 두면 노드 종류와 무관하게 이어진다.

version: 1.0

interfaces:

  VideoData:
    description: 영상 데이터

  ImageData:
    description: 이미지 데이터

  WeatherData:
    description: 기상 관측값

  DocumentData:
    description: 문서 데이터

  AnalysisResult:
    description: 분석 결과


nodes:

  load_platform_cctv:
    name: 승강장 CCTV 불러오기
    description: 승강장에 설치된 CCTV 영상을 불러온다.
    inputs: []
    outputs:
      - VideoData
    properties:
      subject: 승강장

  extract_frames:
    name: 영상 프레임 추출
    description: 영상에서 분석용 이미지 프레임을 추출한다.
    inputs:
      - VideoData
    outputs:
      - ImageData
    properties: {}

  load_track_image:
    name: 궤도 검측 이미지 불러오기
    description: 검측차가 촬영한 궤도 이미지를 불러온다.
    inputs: []
    outputs:
      - ImageData
    properties:
      subject: 궤도

  load_inspection_doc:
    name: 궤도 점검 보고서 불러오기
    description: 궤도 점검 과정에서 기록된 보고서를 불러온다.
    inputs: []
    outputs:
      - DocumentData
    properties:
      subject: 궤도

  analyze_congestion:
    name: 승강장 혼잡도 분석
    description: 이미지에서 승강장 혼잡도를 분석한다.
    inputs:
      - ImageData
    outputs:
      - AnalysisResult
    properties:
      subject: 승강장

  detect_track_crack:
    name: 궤도 균열 검출
    description: 이미지에서 궤도 균열을 검출한다.
    inputs:
      - ImageData
    outputs:
      - AnalysisResult
    properties:
      subject: 궤도

  load_weather_sensor:
    name: 기상 관측값 불러오기
    description: 관측 장비에서 기상 관측값을 불러온다.
    inputs: []
    outputs:
      - WeatherData
    properties:
      subject: 기상

  analyze_icing_risk:
    name: 결빙 위험도 분석
    description: 기상 관측값에서 결빙 위험도를 분석한다.
    inputs:
      - WeatherData
    outputs:
      - AnalysisResult
    properties:
      subject: 기상

  analyze_wind_risk:
    name: 강풍 위험도 분석
    description: 기상 관측값에서 강풍 위험도를 분석한다.
    inputs:
      - WeatherData
    outputs:
      - AnalysisResult
    properties:
      subject: 기상

  generate_word:
    name: Word 보고서 생성
    description: 분석 결과를 Word 보고서로 생성한다.
    inputs:
      - AnalysisResult
    outputs:
      - DocumentData
    properties: {}

  generate_ppt:
    name: PPT 보고서 생성
    description: 분석 결과를 PPT 보고서로 생성한다.
    inputs:
      - AnalysisResult
    outputs:
      - DocumentData
    properties: {}
