# 구조 원칙
# - 노드 필드는 name / description / inputs / outputs / properties(선택) 다섯 개다.
# - 노드는 그룹 없이 평평하게 둔다. data/transfer/action 구분은 inputs/outputs 에서
#   계산되므로 중복이고, 중첩 구조는 노드 id 중복을 YAML 이 잡아주지 못한다.
# - 노드 간 관계(near 등)는 파일에 적지 않는다. 읽는 쪽(시각화, 조회)이 계산한다.
# - properties 에는 인터페이스로 표현되지 않는 것만 적는다.
#   modality(video/image)나 category(data/transfer/action)는 inputs/outputs 에서
#   유도되므로 넣지 않는다.
# - properties 의 value 는 시각화 라벨에 그대로 노출되므로
#   코드값이 아니라 사람이 읽는 단어로 쓴다.
#
# 사용 중인 property key
# - source      : 데이터를 가져오는 곳 (불러오기 노드)
# - site        : 데이터가 만들어진 장소 (불러오기 노드)
# - target      : 분석 대상 (분석 노드)
# - output_kind : 산출물 종류 (산출 노드)
# - format      : 산출물 형식 (산출 노드)

version: 1.0

interfaces:

  MediaData:
    description: 이미지 또는 동영상 데이터

  DocumentData:
    description: 문서 데이터 (Word, Excel, PDF 등)

  AnalysisResult:
    description: 분석 결과


nodes:

  load_cctv_platform:
    name: 승강장 CCTV 불러오기
    description: 승강장에 설치된 CCTV 동영상을 불러온다.
    inputs: []
    outputs:
      - MediaData
    properties:
      source: cctv
      site: 승강장

  load_inspection_car_image:
    name: 검측차 이미지 불러오기
    description: 검측차가 본선에서 촬영한 이미지를 불러온다.
    inputs: []
    outputs:
      - MediaData
    properties:
      source: cctv
      site: 본선

  load_inspection_document:
    name: 점검 문서 불러오기
    description: 점검 과정에서 기록된 문서를 불러온다.
    inputs: []
    outputs:
      - DocumentData
    properties:
      source: 점검문서

  analyze_congestion:
    name: 승강장 혼잡도 분석
    description: 영상이나 이미지에서 승강장 혼잡도를 분석한다.
    inputs:
      - MediaData
    outputs:
      - AnalysisResult
    properties:
      target: 승강장

  detect_structure_crack:
    name: 구조물 균열 분석
    description: 영상이나 이미지에서 구조물 균열을 분석한다.
    inputs:
      - MediaData
    outputs:
      - AnalysisResult
    properties:
      target: 구조물

  analyze_incident_frequency:
    name: 승강장 장애 발생 빈도 분석
    description: 문서에서 승강장 장애가 얼마나 자주 발생했는지 분석한다.
    inputs:
      - DocumentData
    outputs:
      - AnalysisResult
    properties:
      target: 승강장

  summarize_defect_history:
    name: 구조물 결함 이력 요약
    description: 문서에서 구조물 결함이 어떻게 이어져 왔는지 요약한다.
    inputs:
      - DocumentData
    outputs:
      - AnalysisResult
    properties:
      target: 구조물

  generate_word:
    name: Word 생성
    description: 분석 결과를 Word 문서로 생성한다.
    inputs:
      - AnalysisResult
    outputs:
      - DocumentData
    properties:
      output_kind: document
      format: word

  generate_ppt:
    name: PPT 생성
    description: 분석 결과를 PPT 문서로 생성한다.
    inputs:
      - AnalysisResult
    outputs:
      - DocumentData
    properties:
      output_kind: document
      format: ppt
