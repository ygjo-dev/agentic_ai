# 구조 원칙
#
# - 노드에는 name 과 description 이 있다. 종류를 나누는 필드(kind)는 없다 —
#   성격은 관계가 말한다. hasOutput 이 있으면 실행해서 무언가를 내놓는 노드이고,
#   about 의 대상으로 등장하면 대상(그룹) 노드다.
#
# - 노드에 두 칸이 더 올 수 있다. 둘 다 관계가 아니라 그 노드 자신의 사실이다.
#
#     source   외부 요청에서 이 값이 곧장 들어오는 자리.
#              from 이 어디서 오는지 말한다.
#                spoken.argument           발화 해석 LLM 이 argument 로 뽑은 값
#                context.selectedLocation  KRRI_ASAP 화면이 우클릭으로 찍은 한 점
#                context.view.bbox         KRRI_ASAP 화면이 지금 비추는 사각형
#              fields 는 화면 값 안에서 semantic 칸을 읽는 경로다(아래 「semantic 칸과
#              표현」). 칸이 없는 값(발화 인자)에는 두지 않는다.
#              **유일한 생성원이 아니다.** 지점 좌표는 화면에서 곧장 오기도 하고
#              장소 좌표 변환이 내놓기도 한다. source 는 「밖에서 여기로 바로 들어올
#              수 있다」는 뜻이고, 그래서 source 가 있는 노드가 경로의 시작점이다.
#              description 은 menu 문장의 재료다. 첫 문장은 명사구로 적고 뒤 문장에
#              언제 이 자리를 쓰는지 적는다.
#
#     tool     이 노드를 무엇으로 실행하는가.
#              id          "<server_id>/<도구 이름>". Gateway 가 qualifiedName 으로 쓰는
#                          논리 식별이다. 주소 · 포트 · 기계 이름은 적지 않는다 —
#                          배포마다 다르고 endpoints.py 가 갖는다.
#                          예약 namespace 가 둘이다.
#                            builtin/   Gateway 가 아니라 우리 쪽에서 하는 계산
#                            frontend/  도구를 안 부르고 화면에 내는 지도 명령
#              parameters  도구 칸 -> 값. semantic 입력을 도구 칸에 어떻게 넣는지다.
#                          **hasInput 을 대신하지 않는다.** 「장소 좌표 변환은 장소
#                          이름을 받는다」는 edges 에 그대로 있고, 여기는 그 장소 이름이
#                          geo.geocode 의 query 칸으로 간다는 것만 말한다.
#              outputs     semantic 타입 -> 이 도구의 raw 응답 안에서 그 값을 읽는 경로.
#                          key 는 이 노드의 hasOutput 타입이어야 한다. **뒤 노드가 읽는
#                          타입만 적는다** — 아무도 안 받는 타입(목록 · 경계 도형 …)은 안 적는다.
#                          MCP 도구에만 둔다. builtin 은 만드는 칸이 정해져 있고
#                          (step_service.BUILTIN_ADAPTERS) frontend 는 읽을 응답이 없다.
#                          **hasOutput 을 대신하지 않는다.** 무엇을 내놓는지는 edges 가 말한다.
#
#   parameters 의 값은 아래 꼴뿐이다. 읽는 곳은 execution/step_service.py 다.
#
#     place_name · point.lon          semantic 참조. 뿌리가 이 노드의 hasInput 이어야 한다.
#                                     그 자리에서 건네받지 않은 타입의 칸은 안 보낸다
#     {from: spoken.<이름>,           발화 해석이 함께 뽑은 이름 있는 값.
#      default: …, map: {…}}          말하지 않았으면 default, map 은 사람 말 -> 도구 말
#     {from: context.<경로>}          화면이 보낸 값
#     runtime.now.date · …time        부르는 순간 (Asia/Seoul)
#     {value: <semantic 참조>,        값을 보고 칸을 고른다. 그 어미로 끝날 때만(if) ·
#      if_endswith | unless_endswith} 안 끝날 때만(unless) 보낸다
#     그 밖의 수 · 목록               적힌 그대로 보낸다. 목록 안의 참조도 같은 규칙이다
#
#   outputs 의 한 줄과 source.fields 는 아래 꼴뿐이다. 읽는 곳은 execution/step_service.py 다.
#
#     value: <경로>                   칸이 없는 값 하나 (충전소 번호)
#     fields: {<칸>: <경로>, …}       칸이 있는 값 (지점 좌표의 lon · lat). source.fields 는 이 꼴만
#     list: <경로>, pick: first       목록에서 한 항목을 고른 뒤 그 안에서 value · fields 를 읽는다.
#                                     pick 은 지금 first 하나다
#     경로                            점으로 이은 dict 키 · 목록 번호 (location.0 · bbox.1.0 · items).
#                                     수처럼 보이는 경로("0.0")는 따옴표로 적는다. 안 적으면 수가 된다
#
#   ## semantic 칸과 표현 — 셋을 가른다
#
#   지점 좌표의 칸은 lon · lat, 지도 범위는 minLon · minLat · maxLon · maxLat,
#   행정구역 코드는 code · level 이다. **이 이름은 semantic 칸이지 어느 도구의 칸도 아니다.**
#
#     앞 도구의 raw 응답에서 그 칸이 어디 있나   내놓는 노드의 tool.outputs     location.0
#     화면 값에서 그 칸이 어디 있나              semantic 노드의 source.fields  bbox 안의 0.0
#     뒤 도구의 어느 칸으로 가나                 받는 노드의 tool.parameters    origin_lon: point.lon
#
#   **가운데 공통 모양을 만들지 않는다.** 지점 좌표를 늘 {lon, lat} 객체로 바꿔 건네지
#   않는다. 실행은 칸 하나씩 앞 값 안의 경로를 참조로 적어 넘길 뿐이다($s1.location.0).
#   **적힌 경로가 없는 칸을 이름으로 짐작하지 않는다.** point.lon 을 응답의 lon 칸으로
#   읽지 않고, 그 자리는 실행 수단이 없는 것(unwired)으로 센다.
#
#   **name · description 에 도구 이름을 적지 않는다.** 둘은 menu 문장의 재료라 발화
#   해석 프롬프트에 실린다. 도구 이름은 tool 칸에만 있다
#   (dev/tests/execution/test_wiring_contract.py 가 지킨다).
#
# - 지금 지원하는 관계는 넷이다. 아는 목록은 ontology/graph.py 의
#   SUPPORTED_PREDICATES 가 갖는다.
#     is-a       A 는 B 의 한 종류다      (rdfs:subClassOf)   경로 생성의 타입 매칭
#     about      A 는 B 에 관한 것이다     (dcterms:subject)   대상 판정 · 화면 점선
#     hasInput   A 는 B 를 받는다         (OWL-S 계열)        경로 생성
#     hasOutput  A 는 B 를 내놓는다       (OWL-S 계열)        경로 생성
#
#   **is-a 는 지금 한 줄도 없다.** 값의 출처를 말하던 노드 다섯이 source 로 들어가며
#   함께 사라졌다. 형식 계층으로서의 하위 타입이 실제로 생기면 다시 적는다 — 그것을
#   읽는 곳(graph.ancestors)은 그대로 둔다.
#
#   **새 관계는 그것을 실제로 읽는 로직과 함께 더한다.** "그것을 읽어서 무엇을
#   하는가" 에 답할 수 있으면 SUPPORTED_PREDICATES 에 더하고 읽는 곳을 만든다.
#   읽는 곳이 없는 관계는 파일만 무겁게 하고, 나중에 그것이 맞는지 틀린지
#   확인할 방법도 없다.
#
# - is-a 는 형식 계층이고 about 은 대상이다. 두 축은 직교한다.
#   is-a 에 대상 구분을 시키지 않는다 — 그건 about 의 일이다.
#   is-a 에 출처를 시키지도 않는다 — 그건 source 의 일이다.
#
# - 실행 순서(실선)는 edges 가 아니라 recipe 가 정한다.
#   두 곳에 적으면 진실의 원천이 둘이 되고, 어긋났을 때 어느 쪽이 맞는지 알 수 없다.
#
# - about 은 노드가 무엇에 관한 것인지를 말한다. 경로가 대상을 넘나드는지는
#   graph.crosses_groups 가 이 관계로 계산한다.
#   ★ 그 계산을 recipe 생성 정책에서 최종적으로 어떻게 쓸지는 아직 확정되지
#     않았다. 지금 registration 구현은 넘나드는 경로를 recipe 로 만들지 않는다.
#
# - 불러오기 노드가 없다. 데이터가 노드로 있으므로 "불러오기" 라는 동사가 따로
#   필요 없다. recipe 는 source 가 있는 데이터 노드에서 시작한다.
#
# ---------------------------------------------------------------------------
# 이 온톨로지가 담은 것 : Gateway catalog 의 MCP 도구
#
# **catalog 를 통째로 담지 않았다.** 셋(knowledge.deleteDoc · bim.updateModel ·
# bim.deleteModel)은 데이터를 지우거나 바꾸는 도구라 넣지 않았다. 시연에서
# 눌리면 되돌릴 곳이 없다.
#
# 넷째로 `ev.searchChargers` 를 뺐다(2026-08-26). **Gateway 가 폐기 예정이라고
# 도구 설명에 적어 둔 것이다** — "기존 호출 호환용 전기차 충전소 조회.
# 신규 목록·지도 조회는 ev.searchStations 사용 권장". 같은 일을 하는 도구
# 둘을 대등하게 두니 전기차 후보가 늘 두 배였고(012/013 · 032/033 ·
# 039/040 · 044/045), "옛 호출 호환용으로 보여줘" 라고 말하는 사람은 없어서
# 발화로는 가를 수가 없었다. 문장을 고쳐서 될 일이 아니라 노드를 뺄 자리다.
#
# ## 타입을 무엇으로 묶었나 — 받는 것과 내놓는 것, 두 축뿐이다
#
# **대상별로 타입을 만들지 않았다.** "선거구 목록" · "충전소 목록" 처럼 나누면
# 타입이 대상 수만큼 곱해지는데, 그렇게 나눠도 경로 생성은 달라지지 않는다 —
# 무엇에 관한 목록인지는 about 이 이미 말하기 때문이다. 그래서 "목록" 하나다.
#
#   받는 것 (8)
#     장소 이름   지명 · 역명 · 구간명 · 노선명. 사람이 부르는 이름
#     지점 좌표   경위도 한 점 (lon · lat)
#     지도 범위   좌표 사각형. bbox 한 필드든 minLon/minLat/maxLon/maxLat 네
#                 필드든 같은 타입이다. 어느 모양으로 보낼지는 그 노드의
#                 tool.parameters 가 말한다
#     행정구역 코드   43113 (5자리).  find_admin_boundary_by_point 가 내놓는다
#     선거구 코드     4311101 (7자리)
#     충전소 번호     PW012325.  ev.searchStations 만 내놓는다.
#                 source 가 없다 — 아래 「밖에서 들어오는 자리 다섯」
#
#                 셋을 "식별자" 하나로 묶었었다. 자릿수도 발급처도 다른 값을
#                 한 타입으로 두니 행정구역 코드가 충전소 상세로, 충전소 번호가
#                 연령별 인구 구성으로 흘러가는 가짜 경로가 생겼다.
#                 값이 다르면 타입도 다르다 (2026-08-23 실측)
#     키워드      자유 검색어 (query)
#     웹 주소     url. 식별자에 넣지 않고 따로 뒀다. 넣으면 행정구역 코드로
#                 웹 문서를 가져오는 경로가 생긴다
#
#   내놓는 것 (8. 위의 좌표 셋과 웹 주소가 겹친다)
#     지점 좌표 · 지도 범위 · 웹 주소   다음 도구가 받을 수 있는 것
#     목록        조건에 맞는 항목들. search… · list… 가 내놓는 것
#     항목 상세   한 건의 내용. get… · find…ByPoint 가 내놓는 것
#     데이터셋 정보  무엇을 언제까지 담고 있는지. getDatasetInfo 9개 + dem.getInfo
#     경계 도형   행정구역 폴리곤
#     통계        집계 수치와 변화 추이
#
# **다음 도구가 받는 타입을 함부로 내놓게 하지 않는다.** 경로가 폭발하는 원인이
# 그것 하나다. 좌표를 내놓는 것은 셋이다 — 장소 좌표 변환 · 철도 구간 형상 조회 ·
# 지점 주변 범위 변환. 코드를 내놓는 것은 둘이다 — 행정구역 코드는 지점 행정구역
# 판별이, 충전소 번호는 전기차 충전소 검색이 내놓는다
# (`ev.searchStations` 응답 items 의 stationId, 2026-08-23 실측).
# 선거구 코드를 내놓는 도구는 없다. 사람이 말해야만 들어온다.
# 인구 통계 조회는 설명에
# "지도 범위" 가 나오지만 지도 범위를 내놓게 하지 않았다 — 그렇게 하면 지도
# 범위를 받는 도구 열 개가 그 뒤에 줄줄이 붙는다.
#
# ## 대상을 어떻게 갈랐나 — 섞이면 말이 안 되는 것 넷
#
#   group_transport · group_election · group_population · group_ev
#
# 계열 이름(election · population …)을 그대로 쓰지 않고 굵게 묶었다.
# road.getCctv · rail.getSectionGeometry · geo.getRailwayLines 는 계열이 셋이지만
# 대상은 하나(교통)다. 나누면 "철도 구간을 찾아 그 범위의 CCTV 를 본다" 가
# crosses_groups 에 걸려 죽는다.
#
# **범용 도구에는 about 을 붙이지 않았다.** 어느 분야에서나 쓰이는 것들이다 —
# 장소 좌표 변환 · 지점 주변 범위 변환 · 도달권 계산 · 경로 탐색 · adminBoundary 셋 ·
# vworld 둘 · dem.getInfo · web 둘 · 자료실 셋.
#
# 자료실 셋(문서 검색 · 문서 목록 조회 · 3D 모델 목록 조회)은 원래 group_document
# 라는 대상에 매여 있었다. 그것 하나만 성격이 달랐다 — 교통 · 선거 · 인구 ·
# 전기차 충전은 주제인데 자료실은 그릇이다. "철도 안전 문서" 의 대상은 교통이지
# 자료실이 아니어서 문서 검색이 걸러졌다. 대상에서 빼 범용으로 돌렸다
# (2026-08-23. 판정 61~62/90 -> 80/90. NOTES 「열한째」).
# about 이 붙은 노드가 경로에 하나뿐이면 crosses_groups 는 거짓이므로
# "범용 -> 특정분야" 경로가 살아남는다. 장소 이름 -> 장소 좌표 변환 -> 지점 주변
# 범위 변환 -> CCTV 조회가 그것이다.
#
# ## 밖에서 들어오는 자리 다섯 — 발화에서 셋과 화면에서 둘
#
#   장소 이름     spoken.argument           원래 있던 것
#   키워드        spoken.argument           키워드만 받는 search… 와 웹 검색 · 문서 검색
#                                           열 개가 여기서 출발한다. 시작점이 없으면
#                                           그 열 개는 어느 경로에도 못 들어간다
#   선거구 코드   spoken.argument           코드 하나만 가리킨다. get… 셋이 여기서
#                                           출발한다 — 국회의원 지역구 상세 · 국회의원
#                                           전체 선거구 상세 · 국회의원 선거구 공약 상세.
#                                           "충북 제1선거구 알려줘" 처럼 사람이 이름을
#                                           바로 대는 발화가 그것이다
#   지점 좌표     context.selectedLocation  KRRI_ASAP 화면이 우클릭으로 찍은 한 점
#   지도 범위     context.view.bbox         KRRI_ASAP 화면이 지금 비추고 있는 사각형
#
# **출처는 노드가 아니라 source 다.** 「사용자가 말했다」 · 「화면이 보냈다」는 값의
# 종류가 아니라 값이 들어온 길이라, 그것을 노드로 두면 is-a 가 형식 계층이 아니라
# 출처를 말하게 된다. 그래서 받는 타입 자신에 source 를 붙인다.
#
# 행정구역 코드에는 source 가 없다(2026-08-24). 사람은 "43113" 이라고 말하지 않고,
# 그 자리를 발화에서 받게 하면 (연령별 인구 구성 조회 × 행정구역 코드) 한 벌이
# 발화 자리와 앞 단계 자리를 둘 다 맡아야 했다.
# 충전소 번호에도 source 가 없다(2026-08-26). 같은 까닭이다 — 사람은 "PL033780" 이라고
# 말하지 않는다. 충전소 상세 조회 노드는 남는다. 전기차 충전소 검색 뒤에 붙는 경로가
# 그것을 쓴다.
#
# **화면에서 온 둘은 성격이 다르다.** 앞의 셋은 사람이 입으로 말한 값이고, 이 둘은
# 사람이 아무 값도 말하지 않았는데 화면이 함께 보내온 값이다. 그래서 source 의
# description 이 「언제 이 자리를 쓰는가」까지 두 마디로 말한다 — 이 문장이 menu 를
# 거쳐 판단이 서는 자리다.
#
# 화면 두 자리를 붙인 대가는 recipe 40 -> 59개 · menu 3321 -> 4833자였다
# (2026-08-28 실측, NOTES.md 「마흔여섯째」).
#
# **hasInput 이 하나도 없는 도구는 recipe 가 될 수 없다.** getDatasetInfo 아홉과
# knowledge.listDocs · bim.listModels 는 인자를 안 받아서 can_connect 가 누구
# 뒤에도 세우지 못하고, start_ids 는 source 가 있는 노드만 세우므로 첫 칸에도
# 못 온다. 온톨로지에는 있고 recipe 에는 없다. 열한 개다. 부를 일이 없어 tool 도 안
# 적었다.

version: 2.0

nodes:

  # ---------------------------------------------------------- 타입 : 오가는 것

  place_name:
    name: 장소 이름
    description: 사람이 부르는 지명이나 역 이름, 구간 이름.
    source:
      from: spoken.argument
      description: 사용자가 발화에서 지목한 장소.

  # 화면이 찍은 한 점은 {lon, lat, label, source} 로 온다. 우클릭 전에는 null 이다
  # (KRRI_ASAP/ASAP-web/packages/shared/src/types/index.ts 의 ChatRequest.context.selectedLocation.
  #  읽기만 했다).
  point:
    name: 지점 좌표
    description: 한 지점의 경위도 좌표.
    source:
      from: context.selectedLocation
      description: 사용자가 화면에서 찍어 둔 한 지점. 발화가 장소 이름 대신 여기나 이 위치, 선택한 위치라고 가리킬 때 쓴다.
      fields:
        lon: lon
        lat: lat

  # 화면이 비추는 사각형은 view.bbox 한 칸에 [[minLon, minLat], [maxLon, maxLat]] 두 겹으로
  # 온다(같은 파일의 ChatRequest.context.view.bbox). 칸마다 그 안의 번호로 읽는다.
  map_extent:
    name: 지도 범위
    description: 지도에서 다룰 좌표 범위.
    source:
      from: context.view.bbox
      description: 사용자 화면에 지금 보이는 좌표 범위. 발화가 장소 이름 대신 지금 보이는 곳이나 현재 화면, 이 근처라고 가리킬 때 쓴다.
      fields:
        minLon: "0.0"
        minLat: "0.1"
        maxLon: "1.0"
        maxLat: "1.1"

  admin_code:
    name: 행정구역 코드
    description: 시도와 시군구, 읍면동을 가리키는 코드.

  district_code:
    name: 선거구 코드
    description: 선거구 한 곳을 가리키는 코드.
    source:
      from: spoken.argument
      description: 사용자가 발화에서 집어 말한 코드나 이름.

  station_id:
    name: 충전소 번호
    description: 전기차 충전소 한 곳을 가리키는 번호.

  keyword:
    name: 키워드
    description: 무엇을 찾을지 적은 검색어.
    source:
      from: spoken.argument
      description: 사용자가 발화에서 찾아 달라고 한 말.

  web_address:
    name: 웹 주소
    description: 가져올 웹 문서의 주소.

  item_list:
    name: 목록
    description: 조건에 맞는 항목들.

  item_detail:
    name: 항목 상세
    description: 한 항목의 자세한 내용.

  dataset_info:
    name: 데이터셋 정보
    description: 데이터가 무엇을 언제까지 담고 있는지.

  boundary_shape:
    name: 경계 도형
    description: 행정구역 경계 도형.

  statistics:
    name: 통계
    description: 집계한 수치와 변화 추이.

  # 받는 노드가 하나도 없는 타입이다. 경계 도형 · 통계와 같은 자리다 —
  # 이것을 내놓는 노드 뒤에는 아무도 못 선다(can_connect).
  #
  # **경계 도형으로 안 묶었다.** 경계 도형은 행정구역의 경계이고 이것은 한
  # 지점에서 시간을 들여 닿는 범위다. 둘을 한 타입으로 묶으면 (도달권 계산 ->
  # 행정구역 경계를 받는 노드) 가 타입상 이어져 버리는데 그런 경로는 없다.
  reachable_area:
    name: 도달권
    description: 한 지점에서 정해진 시간 안에 닿을 수 있는 범위.

  # 받는 노드가 하나도 없는 타입이다. 도달권 · 경계 도형 · 통계와 같은 자리다.
  #
  # **도달권으로 안 묶었다.** 도달권은 한 지점에서 시간을 들여 닿는 범위(면)이고
  # 이것은 두 지점을 잇는 하나의 길(선)이다. 둘을 한 타입으로 묶으면 도달권을
  # 받는 노드 뒤에 경로 탐색이 타입상 이어져 버리는데 그런 경로는 없다.
  travel_route:
    name: 이동 경로
    description: 한 지점에서 다른 지점까지 가는 길과 갈아타는 곳, 걸리는 시간.

  # 받는 노드가 하나도 없는 타입이다. 그래서 이것을 내놓는 노드 뒤에는 아무도
  # 못 선다(can_connect). 경계 도형 · 통계와 같은 자리이고, 다른 점은 조회해서
  # 받는 자료가 아니라 화면이 바뀌는 것이라는 것뿐이다.
  #
  # 이 설명 문장은 menu 문장의 재료라 발화 해석 프롬프트에 실린다.
  # 「목록」과 갈리는 말이 여기 있어야 한다.
  #
  # **이 한 문장이 「전」과의 차이 열둘 중 셋을 갈랐다** (2026-08-29 실측,
  # NOTES.md 「마흔아홉째」). "화면에 표시하는 것" 이라 적었더니 "오송역 위치
  # 보여줘" 가 좌표(point)를 버리고 이쪽을 골라 적중 3회를 잃었다 — KRRI_ASAP 도 같은
  # 자리를 낱말로 막아 두었다(show-facility 의 `Do Not Use When` 이 "오송역
  # 보여줘 · 오송역 이동 · 의왕역 가줘" 다).
  #
  # **그래서 문안을 고쳐 봤고 되돌렸다.** 「시설물·모니터링·점검·손상·센서를
  # 짚을 때만 쓴다」로 바꾸니 그 셋은 살아났는데(1번 3/3) 시설물과 무관한
  # 다섯 자리가 새로 빗나가 빗나감이 9 -> 14 가 됐다. **1순위가 빗나감이라
  # 되돌렸다.** 표는 NOTES.md 에 있다. 문안을 또 흔들기 전에 그것을 읽는다.
  facility_view:
    name: 시설물 화면
    description: 디지털 트윈 화면에 띄운 시설물. 자료를 조회해 받는 것이 아니라 화면에 표시하는 것이다.

  # ---------------------------------------------------------- 대상 : 무엇에 관한 것인가

  group_transport:
    name: 교통
    description: 도로와 철도, 현장 영상에 관한 것.

  group_election:
    name: 선거
    description: 선거구와 당선인, 공약에 관한 것.

  group_population:
    name: 인구
    description: 주민등록 인구와 그 변화에 관한 것.

  group_ev:
    name: 전기차 충전
    description: 전기차 충전소와 충전기에 관한 것.

  # ---------------------------------------------------------- 기능 : 범용 (about 없음)

  # 응답은 {location: [경도, 위도], bbox: [[minLon, minLat], [maxLon, maxLat]], address} 다
  # (dev/tools/probe_out/geo.geocode.query-오송역-2026-08-26.json). 지점 좌표와 지도 범위를
  # 둘 다 이 응답에서 읽는다.
  geocode_place:
    name: 장소 좌표 변환
    description: 좌표를 찾는다.
    tool:
      id: asap-mcp-core/geo.geocode
      parameters:
        query: place_name
      outputs:
        point:
          fields:
            lon: location.0
            lat: location.1
        map_extent:
          fields:
            minLon: bbox.0.0
            minLat: bbox.0.1
            maxLon: bbox.1.0
            maxLat: bbox.1.1

  # **Gateway 를 안 부르는 계산이다.** 지점 좌표 하나를 반경만큼 넓혀 지도 범위로
  # 바꾼다. vendor 의 point_radius_to_bbox 어댑터가 그 계산을 갖고 있어서, 실행은
  # 이 노드를 따로 부르지 않고 바로 뒤 도구 단계에 그 입력과 어댑터를 얹는다
  # (execution/step_service.py 의 BUILTIN_ADAPTERS).
  #
  # **왜 노드로 드러냈나.** 지점을 범위로 바꾸는 것은 뜻이 바뀌는 일인데, 그것이
  # 배선 줄 안의 어댑터 이름에 숨어 있으면 온톨로지는 「CCTV 조회가 지점 좌표를
  # 받는다」고 거짓을 말해야 했다. road.getCctv 도 ev.searchStations 도 받는 것은
  # 범위다.
  #
  # **반경 15000m 는 재본 값이다.** 오송역에서 CCTV 83건이 나왔다. 어댑터가 위도를
  # 보정해 세로가 ±0.1347도로 좁아지므로 네 변을 똑같이 넓히던 것과 수가 다르다.
  # KRRI_ASAP 의 cctv-around-point 는 기본 1000m 인데 재보지 않은 숫자를 새로
  # 들이지 않는다.
  #
  # **장소 좌표 변환이 내놓는 지도 범위와 다르다.** geocode 의 bbox 는 한 변이
  # 1km 라 그것으로 CCTV 를 찾으면 0건이다(2026-08-23 실측). 그래서 장소에서 둘레를
  # 볼 때는 좌표를 받아 이 노드로 넓힌다.
  #
  # **중심은 [경도, 위도] 목록 한 칸으로 넘긴다.** 어댑터가 목록의 앞 두 수를 경도 ·
  # 위도로 읽는다(vendor 의 _parse_lon_lat). 지점 좌표를 통째로 넘기면 앞 값의 raw
  # 모양(geocode 의 location 배열 · 화면의 {lon, lat})을 어댑터가 짐작해 가려야 한다.
  point_to_map_extent:
    name: 지점 주변 범위 변환
    description: 지점 주변 일정 반경을 지도 범위로 변환한다.
    tool:
      id: builtin/geo.pointRadiusToBbox
      parameters:
        center: [point.lon, point.lat]
        radiusMeters: 15000

  # **about 을 안 붙였다.** 지금 대상 넷은 교통(도로·철도·현장 영상) · 선거 ·
  # 인구 · 전기차 충전인데, 한 지점에서 걷거나 차로 닿는 범위는 그 넷 중
  # 어느 것에 관한 것도 아니다. 어느 이동수단으로든 같은 계산이라
  # 교통에 넣으면 「도로와 철도」라고 적힌 그 대상의 뜻이 흐려진다.
  # 좌표를 받아 도형을 내놓는 범용 계산이라 장소 좌표 변환과 같은 자리에 둔다.
  # 대상을 새로 만들지도 않았다 — 대상 하나에 기능 하나면 그 대상이 하는 일이
  # 「후보를 가른다」가 아니라 「기능 하나를 가리킨다」가 된다.
  #
  # 좌표 칸 이름이 lon · lat 이 아니라 origin_lon · origin_lat 이다.
  #
  # **이동수단과 시간을 발화에서 받는다.** 발화 해석이 사람이 쓰는 말(도보 ·
  # 자전거 · 승용차 · 대중교통)까지 내놓고, 도구가 쓰는 말로 바꾸는 표가 mode 의
  # map 이다. 사람이 안 말하면 default 로 간다 — 대중교통 30분이고 그것이 이 기능을
  # 세울 때의 값이다. 도구 기본값(30분 · WALK)에 기대지 않는다.
  #
  # **max_minutes 가 아니라 cutoffs_minutes 다.** 둘은 한 값일 때 같은 답을
  # 낸다(2026-09-08 실측 — BICYCLE 60분에서 max_minutes=60 과
  # cutoffs_minutes=[60] 이 셀 6,282개 · polygon 1개로 글자까지 같고, 응답의
  # max_minutes 도 60 으로 온다). 목록을 받는 칸 하나로 두면 「15분, 30분,
  # 60분」처럼 여러 겹을 말한 발화가 같은 칸으로 간다 — 그때 polygon 이 셋 오고
  # 각 feature 의 properties.cutoff_min 이 몇 분 겹인지 말한다(실측).
  #
  # mode 의 값은 LIVE 스키마 그대로다 — WALK · BICYCLE · CAR · TRANSIT.
  # 넷 다 눌러 봤다(2026-09-08 · 의왕역 좌표. WALK 20분 65셀 · BICYCLE 30분
  # 1,345셀 · CAR 15분 1,377셀 · TRANSIT 45분 2,491셀). 그 밖의 값은
  # HTTP 500 "Input should be 'WALK', 'BICYCLE', 'CAR' or 'TRANSIT'" 이다.
  compute_isochrone:
    name: 도달권 계산
    description: 한 지점에서 걸어서나 자전거·차·대중교통으로 몇 분 안에 어디까지 갈 수 있는지 그 범위를 계산한다.
    tool:
      id: r5-server/compute_isochrone
      parameters:
        origin_lon: point.lon
        origin_lat: point.lat
        cutoffs_minutes:
          from: spoken.minutes
          default: [30]
        mode:
          from: spoken.travel_mode
          default: 대중교통
          map:
            도보: WALK
            자전거: BICYCLE
            승용차: CAR
            대중교통: TRANSIT

  # **about 을 안 붙였다. 도달권 계산과 같은 까닭이다.** 이름이 「경로」라고
  # 교통에 넣지 않았다 — 대상 교통은 「도로와 철도, 현장 영상에 관한 것」이고
  # 이것은 좌표 둘을 받아 그 사이의 길을 내놓는 범용 계산이다. 걸어서 가든
  # 열차로 가든 같은 계산이라 교통에 넣으면 그 대상의 뜻이 흐려진다.
  #
  # **좌표를 둘 받는다.** 관계는 「지점 좌표를 받는다」 한 줄이고, 어느 것이
  # 출발이고 어느 것이 도착인지는 parameters 가 말한다 — 도착은 hasInput 으로
  # 건네받은 지점 좌표(앞의 장소 좌표 변환)이고, 출발은 화면이 찍어 둔 자리에서
  # 곧장 온다. 둘을 함께 쓰는 유일한 노드다.
  #
  # date · time_kst 는 required 다(실측 2026-09-06 · 빼면 HTTP 500
  # "2 validation errors ... Field required"). 고정된 날짜를 박으면 그날이
  # 지나는 순간 거짓이 되므로 부르는 순간의 값을 쓴다. 도구 설명이 KST 를 요구한다.
  # required 는 from_lat · from_lon · to_lat · to_lon · date · time_kst 여섯이다.
  plan_trip:
    name: 경로 탐색
    description: 찍어 둔 지점에서 말한 장소까지 대중교통으로 가는 길을 갈아타는 곳과 걸리는 시간까지 찾는다.
    tool:
      id: otp-router/otp_plan_trip
      parameters:
        from_lat:
          from: context.selectedLocation.lat
        from_lon:
          from: context.selectedLocation.lon
        to_lat: point.lat
        to_lon: point.lon
        date: runtime.now.date
        time_kst: runtime.now.time

  admin_boundary_dataset_info:
    name: 행정경계 데이터 정보
    description: 시도와 시군구, 읍면동 경계 데이터가 무엇을 담고 있는지 알려준다.

  # **층위를 발화에서 받는다.** 안 보내면 도구가 스키마 기본값 sigungu 로
  # 읽어서, 시도나 읍면동 이름을 말한 발화가 조용히 0건이 된다
  # (2026-09-08 실측 — query="충청북도" 0건 · query="오송읍" 0건 ·
  #  query="논산" 1건 · query="강남구" 1건. 시군구 이름만 걸렸다).
  # layer 를 맞춰 보내면 query="충청북도" + layer=sido 가 1건이다.
  #
  # 지도 범위 쪽은 층위가 곧 「무슨 경계를 그릴까」다 — 같은 화면 bbox 에서
  # sido 4건 · sigungu 8건 · emd 20건이 온다(실측).
  #
  # ★ query 와 layer 는 함께 좁힌다. 이름이 그 층위에 없으면 0건이다
  #   (query="논산" + layer=emd 0건). 그래서 층위를 잘못 뽑으면 0건이 되는데,
  #   그것은 이름과 층위가 실제로 안 맞는 것이라 조용한 sigungu 기본값보다
  #   낫다 — 사람이 말한 것을 그대로 물어본 결과다.
  #
  # 사람이 쓰는 말(시도 · 시군구 · 읍면동)을 도구가 쓰는 말(sido · sigungu · emd)로
  # 바꾸는 표는 지점 행정구역 판별과 같은 것이라 앵커로 한 번만 적는다.
  search_admin_boundaries:
    name: 행정구역 조회
    description: 행정구역 경계를 이름이나 코드, 레이어로 조회한다.
    tool:
      id: asap-mcp-core/adminBoundary.searchBoundaries
      parameters:
        query: keyword
        bbox: [map_extent.minLon, map_extent.minLat, map_extent.maxLon, map_extent.maxLat]
        layer: &admin_level_layer
          from: spoken.admin_level
          default: 시군구
          map:
            시도: sido
            시군구: sigungu
            읍면동: emd

  # 층위를 발화에서 받는 까닭은 위 행정구역 조회와 같다.
  #
  # 안 보내면 시도 · 시군구 · 읍면동 세 칸이 한꺼번에 온다(실측). 그때 뒤에 오는
  # 인구 도구는 몇째 칸을 쓸지 골라야 했고 그것이 items.1 로 시군구에 박혀
  # 있었다 — 「충청북도 연령대별 인구」가 청주시 상당구 193,079명을 답하던
  # 자리다(2026-09-08 실측).
  #
  # layer 를 보내면 그 층위 한 칸만 온다(실측 2026-09-08 · 충청북도 좌표에서
  # sido -> 43 충청북도 · sigungu -> 43111 청주시 상당구 · emd -> 43111102
  # 북문로1가). **칸을 고르는 것이 아니라 도구에게 물어보는 것이다.** 응답의
  # 몇째 칸을 셀지 정하면 그 셈이 응답 모양에 매이는데, layer 는 도구가 그 뜻으로
  # 가진 칸이라 응답이 늘어도 안 어긋난다.
  #
  # layer 없이 부른 응답은 여섯 지점(오송·강남·부산·제주·금산·세종)에서 items 가 늘
  # 3건이고 순서가 sido -> sigungu -> emd 로 고정이었다. 세종처럼 시군구가 없는 곳도
  # sigungu 자리를 같은 이름으로 채워 순서가 안 밀린다. 응답 전문은 dev/tools/probe_out/ 에 있다.
  #
  # **행정구역 코드는 items 의 첫 칸에서 읽는다(pick: first).** layer 로 한 층위만
  # 돌려주므로 items 는 늘 한 칸이다. 아무 구역에도 안 걸리는 지점(바다)에서는 items 가
  # 비고(dev/tools/probe_out/adminBoundary.findBoundaryByPoint.동해바다0건-2026-08-24.json)
  # 그때 뒤 단계의 code · level 이 빈다. 다른 칸을 대신 고르지 않는다.
  find_admin_boundary_by_point:
    name: 지점 행정구역 판별
    description: 그 지점의 행정구역과 코드를 찾는다.
    tool:
      id: asap-mcp-core/adminBoundary.findBoundaryByPoint
      parameters:
        lon: point.lon
        lat: point.lat
        layer: *admin_level_layer
      outputs:
        admin_code:
          list: items
          pick: first
          fields:
            code: code
            level: layerId

  vworld_dataset_info:
    name: VWorld 데이터 정보
    description: VWorld 행정구역 프리셋 목록과 설정 상태를 알려준다.

  get_vworld_boundaries:
    name: VWorld 행정경계 조회
    description: VWorld 에서 리 단위까지 경계 도형을 내려받는다.
    tool:
      id: asap-mcp-core/vworld.getAdministrativeBoundaries
      parameters:
        query: keyword
        bbox: [map_extent.minLon, map_extent.minLat, map_extent.maxLon, map_extent.maxLat]

  dem_info:
    name: 표고 데이터 정보
    description: 수치표고모델의 범위와 줌 레벨, 좌표계를 알려준다.

  # web-search 서버의 도구다. 부르면 실패한다 — "MCP tool 'web-search/web.search'
  # is not applied for this user." 데이터가 없는 것이 아니라 우리 user_context 에
  # web-search 서버가 안 열려 있는 것이다. KRRI_ASAP 쪽 권한이라 우리가 못 연다.
  web_search:
    name: 웹 검색
    description: 인터넷에서 최근 며칠이나 특정 사이트로 좁혀 공개 정보를 검색한다.
    tool:
      id: web-search/web.search
      parameters:
        query: keyword

  # **tool 이 없다. 모르면 적지 않는다.** web.fetch 의 required 는 url 하나이고
  # 그 값은 앞 단계인 web.search 의 결과에서 꺼내야 한다. 그런데 web.search 가
  # 권한에 막혀 응답 모양을 한 번도 못 봤다. 발화에서 온 말을 url 로 쓰면 부르면
  # 반드시 틀린다. 그래서 (키워드 -> 웹 검색 -> 웹 문서 가져오기)는 실행할 수
  # 없고 dev/tools/check_wiring.py 가 이 자리를 「C」로 센다.
  web_fetch:
    name: 웹 문서 가져오기
    description: 웹 주소의 제목과 본문을 가져온다.

  # ---------------------------------------------------------- 기능 : 교통

  # 받는 것은 지도 범위 하나다. 네 칸이 전부 required 다.
  #
  # 범위가 어디서 오느냐는 셋이고 칸은 같다.
  #   화면이 비추는 사각형   KRRI_ASAP 의 current-view-cctv 가 하는 것과 같다 — 그것도
  #                          $context.view.bbox 네 칸을 road.getCctv 에 그대로 넣는다
  #                          (KRRI_ASAP/ASAP-orchestrator/plugins/current-view-cctv/plugin.md
  #                           의 Tool Input. 읽기만 했다)
  #   철도 구간 형상 조회    그 bbox 를 그대로 받는다. rail.getSectionGeometry 의 bbox 는
  #                          [[126.868587, 36.619576], [127.328115, 37.554557]] 처럼 두
  #                          겹이다 (2026-08-23 실측)
  #   지점 주변 범위 변환    좌표를 반경 15km 로 넓힌 것
  find_cctv:
    name: CCTV 조회
    description: 지도 범위 안의 CCTV 목록을 조회한다.
    tool:
      id: asap-mcp-core/road.getCctv
      parameters:
        minLon: map_extent.minLon
        minLat: map_extent.minLat
        maxLon: map_extent.maxLon
        maxLat: map_extent.maxLat

  # 응답의 bbox 는 [[minLon, minLat], [maxLon, maxLat]] 두 겹이다 — 위 CCTV 조회 곁의 실측과
  # dev/tools/probe_out/rail.getSectionGeometry.sectionName-오송역-2026-08-26.json. 구간을
  # 못 찾으면 bbox 없이 {error: {code: NOT_FOUND}} 가 온다
  # (dev/tools/probe_out/rail.getSectionGeometry.서울역.json).
  get_railway_section:
    name: 철도 구간 형상 조회
    description: 철도 구간의 선형 좌표를 찾는다.
    tool:
      id: asap-mcp-core/rail.getSectionGeometry
      parameters:
        sectionName: place_name
      outputs:
        map_extent:
          fields:
            minLon: bbox.0.0
            minLat: bbox.0.1
            maxLon: bbox.1.0
            maxLat: bbox.1.1

  # 역명으로 볼지 노선명으로 볼지를 값이 정한다 (2026-08-29 「쉰째」).
  #
  # 둘을 함께 보내는 길은 닫혀 있다 — 도구가 두 절을 AND 로 이어서 같은
  # 값이면 0건이다 (2026-08-27 「서른다섯째」). 맞는 칸 하나만 보낸다.
  #
  #   "…선" 으로 끝나면 노선 이름   stationName 으로 보내면 0건이다
  #   아니면 역 이름               "청주" 는 railwayName 으로 0건이고 stationName
  #                                으로 9건이다(실측). 그래서 「…역 으로 끝나는
  #                                것만 역 이름」으로 좁히지 않았다
  #
  # 한계 — "1호선" 처럼 두 칸 다 답이 있는 값도 노선 쪽으로 간다. "…선" 도 "…역" 도
  # 아닌 값("청주")은 역 이름 자리에 그대로 남는다. 실측 표와 언제 이 자를 걷어내는지는
  # NOTES.md 「쉰째」에 있다.
  #
  # 지도 범위 쪽은 스키마가 진짜로 bbox 배열 한 칸을 받는다(2026-08-30 확인,
  # NOTES.md 「예순째」). 네 칸으로 흩으면 오히려 깨진다.
  get_railway_lines:
    name: 철도 노선 조회
    description: 경부선 같은 노선명이나 역명으로 철도 노선과 역을 조회한다.
    tool:
      id: asap-mcp-core/geo.getRailwayLines
      parameters:
        stationName:
          value: place_name
          unless_endswith: 선
        railwayName:
          value: place_name
          if_endswith: 선
        bbox: [map_extent.minLon, map_extent.minLat, map_extent.maxLon, map_extent.maxLat]

  # ---------------------------------------------------------- 기능 : 선거
  #
  # 노드와 도구의 짝은 온톨로지 노드 description 과 tools.json description 을
  # 맞대어 정했다. 검색 셋은 2026-08-22 실측으로 query 가 실제로 거르는 것도
  # 확인했다 — 인자 없이 부르면 254 · 254 · 476 건이고 query="청주" 로 부르면
  # 4 · 5 건, query="철도" 로 부르면 206 건이다.
  #
  # 상세 넷은 code 말고 **이름 칸을 따로 갖는다**(ASAP-mcp/main.py inputSchema).
  # required 는 없다. 눌러서 확인했다(2026-08-24).
  #
  #   getDistrict               {name: "충북 청주서원"}  feature 1건
  #   getAssemblyDistrict       {name: "청주시 상당구"}  feature 1건
  #   getAssemblyPledgeDistrict {name: "청주시 상당구"}  feature 1건
  #   getLocalPledgeSummary     {sidoName: "충청북도"}   0건 · featureCount 0
  #
  # 0건인 것은 Gateway 쪽 데이터가 미적재여서다
  # (getLocalPledgeSummaryDatasetInfo 의 featureCount 0 · available false).
  # 배선이 없는 것과 데이터가 없는 것은 다르므로 그것만으로는 안 적을 이유가
  # 못 된다. 지도 범위를 받는 셋은 스키마가 bbox 배열 한 칸을 받는다.

  election_district_dataset_info:
    name: 국회의원 지역구 데이터 정보
    description: 제22대 국회의원 지역구 데이터가 무엇을 담고 있는지 알려준다.

  search_election_districts:
    name: 국회의원 지역구 검색
    description: 제22대 국회의원 선거구를 충북 청주서원 같은 선거구명과 시도 약칭, 코드로 검색한다.
    tool:
      id: asap-mcp-core/election.searchDistricts
      parameters:
        query: keyword

  get_election_district:
    name: 국회의원 지역구 상세
    description: 선거구 코드나 충북 청주서원 같은 선거구명으로 제22대 국회의원 선거구 한 곳을 조회한다.
    tool:
      id: asap-mcp-core/election.getDistrict
      parameters:
        name: district_code

  find_election_district_by_point:
    name: 지점 국회의원 지역구 판별
    description: 그 지점의 제22대 국회의원 선거구를 충북 청주흥덕 같은 선거구명으로 찾는다.
    tool:
      id: asap-mcp-core/election.findDistrictByPoint
      parameters:
        lon: point.lon
        lat: point.lat

  assembly_district_dataset_info:
    name: 국회의원 전체 선거구 데이터 정보
    description: 제22대 국회의원 전체 선거구와 공약 집계 데이터가 무엇을 담고 있는지 알려준다.

  search_assembly_districts:
    name: 국회의원 전체 선거구 검색
    description: 제22대 국회의원 선거구 254곳을 청주시 흥덕구 같은 행정구역명과 공약 본문으로 검색하고, 77곳에 붙은 공약 476건을 분야 여섯으로 집계해 낸다.
    tool:
      id: asap-mcp-core/election.searchAssemblyDistricts
      parameters:
        query: keyword
        bbox: [map_extent.minLon, map_extent.minLat, map_extent.maxLon, map_extent.maxLat]

  get_assembly_district:
    name: 국회의원 전체 선거구 상세
    description: 선거구 코드나 청주시 흥덕구 같은 행정구역명으로 제22대 국회의원 선거구 한 곳을 당선인과 정당, 공약과 함께 조회한다.
    tool:
      id: asap-mcp-core/election.getAssemblyDistrict
      parameters:
        name: district_code

  find_assembly_district_by_point:
    name: 지점 국회의원 전체 선거구 판별
    description: 그 지점의 제22대 국회의원 선거구를 청주시 흥덕구 같은 행정구역명과 당선인, 정당, 공약 집계로 찾는다.
    tool:
      id: asap-mcp-core/election.findAssemblyDistrictByPoint
      parameters:
        lon: point.lon
        lat: point.lat

  assembly_pledge_dataset_info:
    name: 국회의원 공약 데이터 정보
    description: 제22대 국회의원 선거구 공약 데이터가 무엇을 담고 있는지 알려준다.

  search_assembly_pledge_districts:
    name: 국회의원 선거구 공약 검색
    description: 제22대 국회의원 선거구 공약을 당선인과 정당, 분야로 검색한다.
    tool:
      id: asap-mcp-core/election.searchAssemblyPledgeDistricts
      parameters:
        query: keyword
        bbox: [map_extent.minLon, map_extent.minLat, map_extent.maxLon, map_extent.maxLat]

  get_assembly_pledge_district:
    name: 국회의원 선거구 공약 상세
    description: 공약 번호나 선거구 코드, 선거구명으로 제22대 국회의원 공약 한 건을 조회한다.
    tool:
      id: asap-mcp-core/election.getAssemblyPledgeDistrict
      parameters:
        name: district_code

  find_assembly_pledge_district_by_point:
    name: 지점 국회의원 선거구 공약 판별
    description: 그 지점의 제22대 국회의원 선거구 공약을 분야로 걸러 찾는다.
    tool:
      id: asap-mcp-core/election.findAssemblyPledgeDistrictByPoint
      parameters:
        lon: point.lon
        lat: point.lat

  local_pledge_dataset_info:
    name: 지방선거 공약 데이터 정보
    description: 2026 지방선거 시도별 교통 공약 요약 데이터가 무엇을 담고 있는지 알려준다.

  # 0건이다(2026-08-22 실측). "2026 지방선거 시도별 공약 요약 데이터를 조회하지
  # 못했습니다." 같은 데이터셋의 getDatasetInfo 도 미적재라고 답한다. Gateway 쪽
  # 데이터다 — 데이터가 들어오면 고칠 것 없이 그대로 돈다.
  search_local_pledge_summaries:
    name: 지방선거 교통 공약 검색
    description: 2026 지방선거 시도별 대표 인물과 정당, 교통 공약 주제를 검색한다.
    tool:
      id: asap-mcp-core/election.searchLocalPledgeSummaries
      parameters:
        query: keyword
        bbox: [map_extent.minLon, map_extent.minLat, map_extent.maxLon, map_extent.maxLat]

  # 2026-08-24 에 {sidoCode: "43"} 을 눌렀다. query.sidoCode 로 되받았고
  # status 는 not_found 인데 그것은 **Gateway 쪽 데이터가 미적재**여서다
  # (dataset.available false · featureCount 0). 인자는 파싱됐다.
  # 시도 코드는 앞 단계(지점 행정구역 판별)의 outputs 가 읽는 admin_code.code 를 받는다.
  # ★ 그 단계는 layer 로 발화가 말한 층위 한 칸만 받아 오고 기본이 시군구라, 이 칸에
  #   시도 코드가 온다는 보장이 없다. 받아들인 recipe 에는 이 노드가 없고 아직 안 풀었다.
  get_local_pledge_summary:
    name: 지방선거 교통 공약 상세
    description: 시도 코드나 이름으로 2026 지방선거 교통 공약 요약 한 건을 조회한다.
    tool:
      id: asap-mcp-core/election.getLocalPledgeSummary
      parameters:
        sidoCode: admin_code.code

  find_local_pledge_summary_by_point:
    name: 지점 지방선거 교통 공약 판별
    description: 그 지점이 속한 시도의 2026 지방선거 교통 공약 요약을 찾는다.
    tool:
      id: asap-mcp-core/election.findLocalPledgeSummaryByPoint
      parameters:
        lon: point.lon
        lat: point.lat

  # ---------------------------------------------------------- 기능 : 인구

  population_dataset_info:
    name: 인구 데이터 정보
    description: 주민등록 인구 데이터의 최신 기준월과 전국 합계를 알려준다.

  search_population_statistics:
    name: 인구 통계 조회
    description: 지역별 인구 수와 순위를 이름이나 코드로 집계한다.
    tool:
      id: asap-mcp-core/population.searchStatistics
      parameters:
        query: keyword
        bbox: [map_extent.minLon, map_extent.minLat, map_extent.maxLon, map_extent.maxLat]

  # 인구 두 도구는 자리가 하나다. 앞 단계는 지점 행정구역 판별뿐이고, 발화에서
  # 곧바로 오는 자리는 없다 — 행정구역 코드에 source 가 없다.
  #
  # **어느 층위인가는 여기서 안 정한다.** 앞 단계가 layer 로 이미 한 층위만 받아
  # 오므로 여기는 그 한 칸을 그대로 쓴다. 두 곳이 층위를 정하면 발화가 시도를
  # 말했는데 여기가 시군구를 집는 어긋남이 다시 생긴다.
  get_age_profile:
    name: 연령별 인구 구성 조회
    description: 연령대별 남녀 인구 구성을 행정구역 코드와 기준월로 본다.
    tool:
      id: asap-mcp-core/population.getAgeProfile
      parameters:
        level: admin_code.level
        code: admin_code.code

  get_population_trend:
    name: 인구 변화 추이 조회
    description: 달마다 인구가 얼마나 늘고 줄었는지 행정구역 코드와 기간으로 본다.
    tool:
      id: asap-mcp-core/population.getTrend
      parameters:
        level: admin_code.level
        code: admin_code.code

  # ---------------------------------------------------------- 기능 : 전기차 충전

  ev_dataset_info:
    name: 충전소 데이터 정보
    description: 전기차 충전소 데이터의 건수와 최신 동기화 시각을 알려준다.

  # ev.searchStations 의 inputSchema 에 query 가 있다 — "충전소명, 주소, 운영기관
  # 키워드". 말한 키워드가 갈 자리가 여기다.
  #
  # **범위는 평평한 네 칸이다.** 이 도구의 inputSchema 에 bbox 라는 칸은 없다 —
  # minLon · minLat · maxLon · maxLat 넷이고 넷 다 optional 이다(ASAP-mcp/main.py:532).
  # 모르는 칸을 보내면 버려져 범위를 아무리 좁혀도 전국 92,821건에서 상한 500건이
  # 온다(2026-08-30 「예순째」). 넷 다 optional 이라 vendor 가 어댑터를 저절로 안 건다.
  #
  # **충전소 번호는 items 의 stationId 다. id 가 아니다**(2026-08-23 실측). 뒤의
  # ev.getStation 이 statId 로 받는 값이 그것이다.
  #
  #   statId="PL033780"            item 이 온다
  #   statId="ev_station_PL033780" item null · 0건 ·
  #                                "충전소 ev_station_PL033780를 찾지 못했거나…"
  #
  # dev/tools/probe_out/ev.getStation.statId-stationId.json 과
  # dev/tools/probe_out/ev.getStation.statId-id.json 이 그 둘이다.
  #
  # ★ 첫 칸을 고른다(pick: first). 검색 결과의 첫 충전소가 사람이 원하는 곳인지는
  #   정하지 않았다. 0건이면 items 가 비어 뒤 단계의 statId 가 빈다.
  search_ev_stations:
    name: 전기차 충전소 검색
    description: 충전소를 지도 범위와 이름·주소·운영기관, 충전기 유형으로 찾는다.
    tool:
      id: asap-mcp-core/ev.searchStations
      parameters:
        query: keyword
        minLon: map_extent.minLon
        minLat: map_extent.minLat
        maxLon: map_extent.maxLon
        maxLat: map_extent.maxLat
      outputs:
        station_id:
          list: items
          pick: first
          value: stationId

  # 자리가 하나다. 앞 단계는 전기차 충전소 검색뿐이다. 충전소 번호가 그 응답의
  # 어느 칸에서 오는지는 전기차 충전소 검색의 tool.outputs 가 말한다.
  get_ev_station:
    name: 충전소 상세 조회
    description: 충전소 한 곳의 충전기별 현재 상태를 번호로 조회한다.
    tool:
      id: asap-mcp-core/ev.getStation
      parameters:
        statId: station_id

  # ---------------------------------------------------------- 기능 : 자료실

  # k 는 돌려받을 조각 수다(tools.json, 기본 4). 6 인 근거 : "철도 안전 교육"
  # 실측에서 k=4 는 시행규칙 조각이 1건인데 k=6 은 법 4 · 시행규칙 2 로 두 문서가
  # 다 보인다. k=10 은 5 · 5 로 더 고르지만 화면은 조각 두셋만 실으므로 응답만
  # 무거워진다. 문서가 늘어 보여줄 문서가 조각 두셋으로 안 덮이면 그때 올린다
  # (NOTES.md 「서른한째」). 문서 둘이 들어 있다(2026-08-26 실측 — 철도안전법 47쪽 ·
  # 철도안전법 시행규칙 52쪽).
  #
  # 문서를 지정하는 filter_docs 는 안 보낸다. 발화 해석이 인자를 하나만 돌려줘
  # 문서 이름과 검색어를 따로 못 뽑는데, 의미 검색이라 검색어에 문서 이름이 섞이면
  # 그 문서 조각이 위로 온다(2026-08-26 실측 — "철도안전법 시행규칙 교육" k=4 에서
  # 시행규칙 4/4건). NOTES.md 「열린 과제」.
  search_documents:
    name: 문서 검색
    description: 문서 본문을 지식베이스에서 찾는다.
    tool:
      id: asap-mcp-core/knowledge.query
      parameters:
        query: keyword
        k: 6

  list_documents:
    name: 문서 목록 조회
    description: 지식베이스에 저장된 문서 목록을 조회한다.

  list_bim_models:
    name: 3D 모델 목록 조회
    description: 업로드된 3D 모델과 타일셋 목록을 조회한다.

  # ---------------------------------------------------------- 기능 : 화면 표시
  #
  # **MCP 도구를 안 부르는 실행 노드다.** 다른 실행 노드는 Gateway 의 MCP 도구를
  # 부르고 그 응답에서 지도 명령이 나오는데, 이것은 부를 도구가 없고 지도 명령
  # 하나가 곧 실행이다 — tool.id 가 frontend/ namespace 다.
  #
  # KRRI_ASAP 의 plugin 에도 실행 단계가 없다. 아홉 개 plugin 에는 다 있는 `## Run` 절이
  # show-facility · system-chat · unsupported-request 셋에만 없고, show-facility 는
  # `## Map` 의 `show_facility $facilityName` 한 줄이 전부다
  # (KRRI_ASAP/ASAP-orchestrator/plugins/show-facility/plugin.md. 읽기만 했다).
  #
  # parameters 는 도구 인자가 아니라 지도 명령의 args 다. 칸 이름은 KRRI_ASAP 화면이
  # 읽는 이름 그대로여야 한다 (useChat.getFacilityName 이 args.facilityName 만 본다).
  #
  # **발화에서 온 값을 그대로 넘긴다.** KRRI_ASAP 은 skill.md 의 「Facility Aliases」
  # 표로 낱말을 시설물명으로 바꾼다("제3터널" -> "시험 제3터널"). 그 표는
  # KRRI_ASAP 설정이고 우리 온톨로지에는 그것을 둘 자리가 없어 베끼지 않았다.
  # NOTES.md 「마흔아홉째」에 남은 격차로 적었다.
  #
  # **맨 뒤에 둔 것은 recipe 번호를 덜 밀려는 것이다.** 경로 생성이 nodes 에 적힌
  # 차례를 따르므로(registration/registry.py 의 all_recipes) 여기 두면 새 recipe 가
  # 「장소 이름」 2단 사슬의 맨 끝에 들어간다.

  show_facility:
    name: 시설물 표시
    description: 오송 테스트트랙의 터널·교량·선로 같은 시설물을 디지털 트윈 화면에서 골라 보여준다.
    tool:
      id: frontend/digitalTwin.showFacility
      parameters:
        facilityName: place_name


edges:

  # ---------------------------------------------------------- hasInput / hasOutput : 범용
  - { from: geocode_place, to: place_name, predicate: hasInput }
  - { from: geocode_place, to: point,      predicate: hasOutput }
  # geocode 의 bbox 다. 한 변이 1km 라 둘레를 볼 때는 쓰지 않고 좌표를 넓힌다 —
  # 그 bbox 를 그대로 받는 경로(장소 이름 -> 장소 좌표 변환 -> 행정구역 조회 ·
  # 인구 통계 조회)는 이 줄로 이어진다.
  - { from: geocode_place, to: map_extent, predicate: hasOutput }

  - { from: point_to_map_extent, to: point,      predicate: hasInput }
  - { from: point_to_map_extent, to: map_extent, predicate: hasOutput }

  # 좌표 하나만 받는다. required 도 origin_lon · origin_lat 둘뿐이다
  # (실측 2026-09-06 · Gateway /api/tools 의 inputSchema).
  # 분과 이동수단은 관계가 아니라 tool.parameters 가 정한다.
  - { from: compute_isochrone, to: point,          predicate: hasInput }
  - { from: compute_isochrone, to: reachable_area, predicate: hasOutput }

  # 지점 좌표 하나만 적는다. 실제로 받는 좌표는 둘(출발 · 도착)인데 온톨로지에는
  # 그 둘이 같은 타입이라 관계도 한 줄이다. 출발을 어디서 받고 도착을 어디서
  # 받는지는 tool.parameters 가 안다 — 관계는 「지점 좌표를 받는다」까지만 말한다.
  - { from: plan_trip, to: point,        predicate: hasInput }
  - { from: plan_trip, to: travel_route, predicate: hasOutput }

  - { from: admin_boundary_dataset_info, to: dataset_info, predicate: hasOutput }

  - { from: search_admin_boundaries, to: keyword,        predicate: hasInput }
  - { from: search_admin_boundaries, to: map_extent,     predicate: hasInput }
  - { from: search_admin_boundaries, to: boundary_shape, predicate: hasOutput }

  # 행정구역 코드를 내놓는 유일한 노드다. 좌표 -> 행정구역 코드 -> 인구 상세가
  # 이 한 줄로 이어진다.
  - { from: find_admin_boundary_by_point, to: point,          predicate: hasInput }
  - { from: find_admin_boundary_by_point, to: boundary_shape, predicate: hasOutput }
  - { from: find_admin_boundary_by_point, to: admin_code,     predicate: hasOutput }

  - { from: vworld_dataset_info, to: dataset_info, predicate: hasOutput }

  - { from: get_vworld_boundaries, to: keyword,        predicate: hasInput }
  - { from: get_vworld_boundaries, to: map_extent,     predicate: hasInput }
  - { from: get_vworld_boundaries, to: boundary_shape, predicate: hasOutput }

  - { from: dem_info, to: dataset_info, predicate: hasOutput }

  - { from: web_search, to: keyword,     predicate: hasInput }
  - { from: web_search, to: item_list,   predicate: hasOutput }
  - { from: web_search, to: web_address, predicate: hasOutput }

  - { from: web_fetch, to: web_address, predicate: hasInput }
  - { from: web_fetch, to: item_detail, predicate: hasOutput }

  # ---------------------------------------------------------- hasInput / hasOutput : 교통
  # CCTV 조회가 받는 것은 지도 범위 하나다. 지점에서 둘레를 볼 때는 지점 주변 범위
  # 변환이 앞에 선다.
  - { from: find_cctv, to: map_extent, predicate: hasInput }
  - { from: find_cctv, to: item_list,  predicate: hasOutput }

  - { from: get_railway_section, to: place_name, predicate: hasInput }
  - { from: get_railway_section, to: map_extent, predicate: hasOutput }

  - { from: get_railway_lines, to: place_name, predicate: hasInput }
  - { from: get_railway_lines, to: map_extent, predicate: hasInput }
  - { from: get_railway_lines, to: item_list,  predicate: hasOutput }

  # ---------------------------------------------------------- hasInput / hasOutput : 선거
  - { from: election_district_dataset_info, to: dataset_info, predicate: hasOutput }

  - { from: search_election_districts, to: keyword,   predicate: hasInput }
  - { from: search_election_districts, to: item_list, predicate: hasOutput }

  - { from: get_election_district, to: district_code,  predicate: hasInput }
  - { from: get_election_district, to: item_detail, predicate: hasOutput }

  - { from: find_election_district_by_point, to: point,       predicate: hasInput }
  - { from: find_election_district_by_point, to: item_detail, predicate: hasOutput }

  - { from: assembly_district_dataset_info, to: dataset_info, predicate: hasOutput }

  - { from: search_assembly_districts, to: keyword,    predicate: hasInput }
  - { from: search_assembly_districts, to: map_extent, predicate: hasInput }
  - { from: search_assembly_districts, to: item_list,  predicate: hasOutput }

  - { from: get_assembly_district, to: district_code,  predicate: hasInput }
  - { from: get_assembly_district, to: item_detail, predicate: hasOutput }

  - { from: find_assembly_district_by_point, to: point,       predicate: hasInput }
  - { from: find_assembly_district_by_point, to: item_detail, predicate: hasOutput }

  - { from: assembly_pledge_dataset_info, to: dataset_info, predicate: hasOutput }

  - { from: search_assembly_pledge_districts, to: keyword,    predicate: hasInput }
  - { from: search_assembly_pledge_districts, to: map_extent, predicate: hasInput }
  - { from: search_assembly_pledge_districts, to: item_list,  predicate: hasOutput }

  - { from: get_assembly_pledge_district, to: district_code,  predicate: hasInput }
  - { from: get_assembly_pledge_district, to: item_detail, predicate: hasOutput }

  - { from: find_assembly_pledge_district_by_point, to: point,       predicate: hasInput }
  - { from: find_assembly_pledge_district_by_point, to: item_detail, predicate: hasOutput }

  - { from: local_pledge_dataset_info, to: dataset_info, predicate: hasOutput }

  - { from: search_local_pledge_summaries, to: keyword,    predicate: hasInput }
  - { from: search_local_pledge_summaries, to: map_extent, predicate: hasInput }
  - { from: search_local_pledge_summaries, to: item_list,  predicate: hasOutput }

  - { from: get_local_pledge_summary, to: admin_code,  predicate: hasInput }
  - { from: get_local_pledge_summary, to: item_detail, predicate: hasOutput }

  - { from: find_local_pledge_summary_by_point, to: point,       predicate: hasInput }
  - { from: find_local_pledge_summary_by_point, to: item_detail, predicate: hasOutput }

  # ---------------------------------------------------------- hasInput / hasOutput : 인구
  - { from: population_dataset_info, to: dataset_info, predicate: hasOutput }

  - { from: search_population_statistics, to: keyword,    predicate: hasInput }
  - { from: search_population_statistics, to: map_extent, predicate: hasInput }
  - { from: search_population_statistics, to: statistics, predicate: hasOutput }

  - { from: get_age_profile, to: admin_code, predicate: hasInput }
  - { from: get_age_profile, to: statistics, predicate: hasOutput }

  - { from: get_population_trend, to: admin_code, predicate: hasInput }
  - { from: get_population_trend, to: statistics, predicate: hasOutput }

  # ---------------------------------------------------------- hasInput / hasOutput : 전기차 충전
  - { from: ev_dataset_info, to: dataset_info, predicate: hasOutput }

  - { from: search_ev_stations, to: keyword,    predicate: hasInput }
  - { from: search_ev_stations, to: map_extent, predicate: hasInput }
  - { from: search_ev_stations, to: item_list,  predicate: hasOutput }
  - { from: search_ev_stations, to: station_id, predicate: hasOutput }

  - { from: get_ev_station, to: station_id,  predicate: hasInput }
  - { from: get_ev_station, to: item_detail, predicate: hasOutput }

  # ---------------------------------------------------------- hasInput / hasOutput : 자료실
  - { from: search_documents, to: keyword,   predicate: hasInput }
  - { from: search_documents, to: item_list, predicate: hasOutput }

  - { from: list_documents,  to: item_list, predicate: hasOutput }
  - { from: list_bim_models, to: item_list, predicate: hasOutput }

  # ---------------------------------------------------------- hasInput / hasOutput : 화면 표시
  #
  # 받는 것을 「장소 이름」으로 적었다. 시설물 이름은 사람이 부르는 이름이고
  # (제3터널 · 오송역 · 선로 시점) 그것이 place_name 의 뜻 그대로다. 시설물
  # 전용 타입을 따로 만들면 밖에서 들어오는 자리가 하나 더 필요해지고, 그러면
  # 발화가 「장소 이름」으로 읽힐 때 이 경로가 통째로 후보에서 빠진다.
  #
  # 내놓는 것은 아무도 안 받는 타입이라 이 노드 뒤에는 누구도 못 선다. 사슬은
  # 「장소 이름 -> 시설물 표시」 한 벌뿐이다.
  - { from: show_facility, to: place_name,    predicate: hasInput }
  - { from: show_facility, to: facility_view, predicate: hasOutput }

  # ---------------------------------------------------------- about : 무엇에 관한 것인가
  - { from: find_cctv,           to: group_transport, predicate: about }
  - { from: get_railway_section, to: group_transport, predicate: about }
  - { from: get_railway_lines,   to: group_transport, predicate: about }
  # 오송 테스트트랙은 철도 시험선이다. 대상을 붙여 두면 이 노드가 지나는 경로가
  # 교통 계열 노드와 한 자리에 서도 crosses_groups 에 안 걸린다.
  - { from: show_facility,       to: group_transport, predicate: about }

  - { from: election_district_dataset_info,         to: group_election, predicate: about }
  - { from: search_election_districts,              to: group_election, predicate: about }
  - { from: get_election_district,                  to: group_election, predicate: about }
  - { from: find_election_district_by_point,        to: group_election, predicate: about }
  - { from: assembly_district_dataset_info,         to: group_election, predicate: about }
  - { from: search_assembly_districts,              to: group_election, predicate: about }
  - { from: get_assembly_district,                  to: group_election, predicate: about }
  - { from: find_assembly_district_by_point,        to: group_election, predicate: about }
  - { from: assembly_pledge_dataset_info,           to: group_election, predicate: about }
  - { from: search_assembly_pledge_districts,       to: group_election, predicate: about }
  - { from: get_assembly_pledge_district,           to: group_election, predicate: about }
  - { from: find_assembly_pledge_district_by_point, to: group_election, predicate: about }
  - { from: local_pledge_dataset_info,              to: group_election, predicate: about }
  - { from: search_local_pledge_summaries,          to: group_election, predicate: about }
