version: 1.0

interfaces:

  Video:
    description: 동영상 데이터

  Image:
    description: 이미지 데이터

  AnalysisResult:
    description: 분석 결과

  Report:
    description: 문서 결과

  Notification:
    description: 알림 메시지


nodes:

  data:

    load_cctv:
      name: CCTV 불러오기
      description: CCTV 동영상을 불러온다.
      inputs: []
      outputs:
        - Video

    load_image:
      name: 이미지 불러오기
      description: 이미지를 불러온다.
      inputs: []
      outputs:
        - Image


  transfer:

    analyze_crowd:
      name: 군중 분석
      description: 동영상에서 군중을 분석한다.
      inputs:
        - Video
      outputs:
        - AnalysisResult

    detect_crack:
      name: 균열 분석
      description: 이미지에서 균열을 분석한다.
      inputs:
        - Image
      outputs:
        - AnalysisResult


  action:

    generate_word:
      name: Word 생성
      description: 분석 결과를 Word 문서로 생성한다.
      inputs:
        - AnalysisResult
      outputs:
        - Report

    generate_ppt:
      name: PPT 생성
      description: 분석 결과를 PPT 문서로 생성한다.
      inputs:
        - AnalysisResult
      outputs:
        - Report

    notify_manager:
      name: 관리자 알림
      description: 분석 결과를 관리자에게 전달한다.
      inputs:
        - AnalysisResult
      outputs:
        - Notification