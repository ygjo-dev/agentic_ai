# 구조 원칙
#
# - 노드에는 name 과 description 만 둔다. 종류를 나누는 필드는 없다 —
#   노드는 그저 존재할 뿐이고, 성격은 관계가 말한다.
#   hasOutput 이 있으면 실행해서 무언가를 내놓는 노드이고,
#   about 의 대상으로 등장하면 대상(그룹) 노드다.
#
# - 관계는 넷뿐이다.
#     is-a       A 는 B 의 한 종류다      (rdfs:subClassOf)   경로 생성의 타입 매칭
#     about      A 는 B 에 관한 것이다     (dcterms:subject)   후보 분류 · 화면 점선
#     hasInput   A 는 B 를 받는다         (OWL-S 계열)        경로 생성
#     hasOutput  A 는 B 를 내놓는다       (OWL-S 계열)        경로 생성
#
#   **새 관계를 만들려면 "그것을 읽어서 무엇을 하는가" 에 답할 수 있어야 한다.**
#   답할 수 없으면 만들지 않는다. 읽는 곳이 없는 관계는 파일만 무겁게 하고,
#   나중에 그것이 맞는지 틀린지 확인할 방법도 없다.
#
# - is-a 는 형식 계층이고 about 은 대상이다. 두 축은 직교한다.
#   is-a 에 대상 구분을 시키지 않는다 — 그건 about 의 일이다.
#   덕분에 범용 노드가 상위 타입 한 줄만 적으면 하위 타입을 전부 받는다.
#     장소 좌표 변환은 "장소 이름" 만 적고도 "말한 장소" 를 받는다.
#
# - 실행 순서(실선)는 edges 가 아니라 recipe 가 정한다.
#   두 곳에 적으면 진실의 원천이 둘이 되고, 어긋났을 때 어느 쪽이 맞는지 알 수 없다.
#
# - about 은 차단하지 않는다. 경로가 대상을 넘나드는지 표시할 뿐이고 판단은 사람이 한다.
#   대상이 다른 두 기능을 한 경로에 세우면 타입상 이어져도 실제로는 실행할 수 없다.
#   그것을 막는 것은 온톨로지가 아니라 사람이다.
#
# - 불러오기 노드가 없다. 데이터가 노드로 있으므로 "불러오기" 라는 동사가 따로
#   필요 없다. recipe 는 데이터 노드에서 시작한다.

version: 2.0

nodes:

  # ---------------------------------------------------------- 타입 : 오가는 것

  place_name:
    name: 장소 이름
    description: 사람이 부르는 지명이나 역 이름.

  map_extent:
    name: 지도 범위
    description: 지도에서 다룰 좌표 범위.

  cctv_list:
    name: CCTV 목록
    description: 조회된 CCTV 지점들.

  spoken_place:
    name: 말한 장소
    description: 사용자가 발화에서 지목한 장소.

  # ---------------------------------------------------------- 대상 : 무엇에 관한 것인가

  group_cctv:
    name: CCTV
    description: 현장을 촬영하는 영상 장비.

  # ---------------------------------------------------------- 기능 : 실행할 수 있는 것

  geocode_place:
    name: 장소 좌표 변환
    description: 장소 이름으로 위치 좌표와 지도 범위를 찾는다.

  find_cctv:
    name: CCTV 조회
    description: 지도 범위 안의 CCTV 목록을 조회한다.


edges:

  # ---------------------------------------------------------- is-a : 형식 계층
  - { from: spoken_place,  to: place_name, predicate: is-a }

  # ---------------------------------------------------------- hasInput / hasOutput
  - { from: geocode_place, to: place_name, predicate: hasInput }
  - { from: geocode_place, to: map_extent, predicate: hasOutput }
  - { from: find_cctv,     to: map_extent, predicate: hasInput }
  - { from: find_cctv,     to: cctv_list,  predicate: hasOutput }

  # ---------------------------------------------------------- about : 무엇에 관한 것인가
  - { from: find_cctv,     to: group_cctv, predicate: about }
