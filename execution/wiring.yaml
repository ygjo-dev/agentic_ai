# 배선표에 남은 것. **transitional compatibility 다.**
#
# 도구 식별(server_id · tool · command)과 입력 배선(어느 칸에 무엇을 넣나 · 기본값 ·
# 사람 말 -> 도구 말 · 값으로 칸 고르기 · 반경 어댑터)은 온톨로지 노드의 tool 로
# 옮겼다. 앞 도구의 응답 · 화면 값에서 semantic 칸을 읽는 경로도 온톨로지에 있다 —
# 내놓는 노드의 tool.outputs 와 semantic 노드의 source.fields 다. 그것들의 원천은
# 이제 ontology/ontology.yaml 이다.
#
# 여기 남은 것은 headline 하나다. 그 노드에서 끝나는 경로의 답 첫 줄이고, 입력
# 배선이 아니라 답 조합 쪽이다. 어디로 옮길지는 따로 정한다.
#
# **새 기능의 원천을 여기 더하지 않는다.** 도구 이름 · 입력 칸 · 기본값 · 응답 경로를
# 여기 적으면 온톨로지와 원천이 둘이 된다.
#
# 줄마다의 실측 근거(응답 전문 · 몇 건이 나왔나 · 왜 이 문장인가)는 그 줄 곁에 있다.
# **다듬지 않는다** — 문장을 고치다 실측 값이 바뀌면 되찾을 데가 없다.


# 노드 -> 답 첫 줄. **온톨로지 밖이다.**
#
# 경로의 마지막 도구 노드의 것만 쓰인다. 도구 이름으로는 만들 수 없는 문장이라
# (road.getCctv -> "CCTV 를 조회했습니다") 노드가 들고 있어야 한다.
# {arg} 는 발화에서 뽑은 값이다. builtin 노드는 답을 말하지 않아 줄이 없다.
headline:

  geocode_place: "{arg} 좌표를 조회했습니다."

  compute_isochrone: "{arg} 도달권을 계산했습니다."

  # {arg} 는 도착지(말한 장소)다 — 출발지는 화면에서 찍은 자리라 발화에 이름이 없다.
  plan_trip: "{arg}까지 가는 경로를 찾았습니다."

  find_cctv: "{arg} CCTV 를 조회했습니다."

  get_railway_section: "{arg} 철도 구간 형상을 조회했습니다."

  get_railway_lines: "{arg} 철도 노선을 조회했습니다."

  find_admin_boundary_by_point: "{arg} 행정구역을 조회했습니다."

  find_election_district_by_point: "{arg} 국회의원 지역구를 조회했습니다."

  find_assembly_district_by_point: "{arg} 국회의원 전체 선거구를 조회했습니다."

  find_assembly_pledge_district_by_point: "{arg} 국회의원 선거구 공약을 조회했습니다."

  find_local_pledge_summary_by_point: "{arg} 지방선거 교통 공약을 조회했습니다."

  search_admin_boundaries: "{arg} 행정구역 경계를 조회했습니다."

  get_vworld_boundaries: "{arg} VWorld 행정경계를 조회했습니다."

  search_population_statistics: "{arg} 인구 통계를 조회했습니다."

  # ── 인구 상세 둘 : 답 첫 줄에 {arg} 를 안 넣는다 ────────────────
  #
  # **말한 이름과 답한 구역이 늘 같지는 않다.** 이 둘은 앞 단계가 고른 행정구역
  # 하나의 값을 낸다. 그 구역이 발화의 이름과 다를 수 있는데, {arg} 를 첫 줄에
  # 넣으면 그 다른 구역의 수치가 발화의 이름으로 읽힌다.
  #
  # 실측 2026-09-08 — 전주시와 청주시가 그 자리다.
  #
  #   전주시 연령대별 인구  ->  geocode 가 완산구 안의 한 점을 주고
  #                            지점 판별이 52111 전주시 완산구를 준다
  #                            "전주시 연령대별 …" 313,529명 (완산구만)
  #   청주시 연령대별 인구  ->  같은 꼴로 43111 청주시 상당구 193,079명
  #
  # **시 전체를 물을 길이 지금 Gateway 에 없다.** 인구 · 행정경계 데이터의
  # 층위가 시도(2자리) · 시군구(5자리) · 읍면동(8자리) 셋뿐이고 그 사이에
  # 시(市)가 없다. 전국 시군구 252개 중 「XX시 YY구」 꼴이 열둘이고
  # (고양 · 부천 · 성남 · 수원 · 안산 · 안양 · 용인 · 전주 · 창원 · 천안 ·
  #  청주 · 포항) 어느 것도 부모 시의 행이 없다.
  #
  #   adminBoundary.searchBoundaries(query=전주시)  전주시 완산구 · 전주시 덕진구
  #   adminBoundary.searchBoundaries(code=5211)     같은 둘. 전주시 행은 없다
  #   getAgeProfile(sigungu, 52110)                 "찾지 못했습니다"
  #   getAgeProfile(sigungu, 5211)                  HTTP 500 "최소 5자리"
  #   getAgeProfile(emd, 5211)                      HTTP 500 "최소 8자리"
  #   getAgeProfile(sido, 5211)                     전북특별자치도 1,718,633명
  #                                                 (층위가 하나 위로 튄다)
  #
  # 그래서 **없는 수치를 만들어 내지 않고 첫 줄에서 이름을 뗐다.** 어느 구역의
  # 값인지는 단계 줄이 두 번 적는다 — 지점 판별이 「1건 · 전주시 완산구」,
  # 인구 도구가 「전주시 완산구 313,529명」이다.
  #
  # 시 전체를 답하려면 도구를 구마다 한 번씩 불러 더해야 하는데, 그것은 한
  # 단계가 한 번 부른다는 실행 계약을 깨는 일이라 여기서 하지 않는다.
  get_age_profile: "연령대별 인구 구성을 조회했습니다."

  get_population_trend: "인구 변화 추이를 조회했습니다."

  search_ev_stations: "{arg} 전기차 충전소를 조회했습니다."

  get_ev_station: "{arg} 충전소 상세를 조회했습니다."

  search_election_districts: "{arg} 국회의원 지역구 목록을 조회했습니다."

  search_assembly_districts: "{arg} 국회의원 전체 선거구 목록을 조회했습니다."

  search_assembly_pledge_districts: "{arg} 국회의원 선거구 공약 목록을 조회했습니다."

  search_local_pledge_summaries: "{arg} 지방선거 교통 공약 목록을 조회했습니다."

  get_election_district: "{arg} 국회의원 지역구를 조회했습니다."

  get_assembly_district: "{arg} 국회의원 전체 선거구를 조회했습니다."

  get_assembly_pledge_district: "{arg} 국회의원 선거구 공약을 조회했습니다."

  get_local_pledge_summary: "{arg} 지방선거 교통 공약 요약을 조회했습니다."

  search_documents: "{arg} 문서를 조회했습니다."

  web_search: "{arg} 웹 검색 결과를 조회했습니다."

  # 도구가 아니라 지도 명령을 내는 노드다(frontend/). 명령만 나가도 답은 한 줄 있다.
  show_facility: "{arg} 시설물을 화면에 띄웠습니다."
