# ★ 2026-09-04 「아흔넷째」 — **여기부터 아래 표가 위의 마흔다섯을 대신한다.**
#
# **왜 또 갈았나.** 마흔다섯을 세우던 「아흔셋째」는 recipe 쉰하나를 그대로 둔
# 채 「부르면 반드시 0건인 여섯」만 표에서 뺐다. 그래서 자에는 없는데 menu 에는
# 남아 **남의 답을 뺏는 recipe** 가 그대로 있었다. 이번에 그 갈래를 recipe 째로
# 지웠다 — **쉰하나에서 서른아홉이다.** 자와 menu 가 같은 서른아홉을 본다.
#
# ★ **지운 열둘과 까닭은 CLAUDE.md 의 「지금 없는 recipe」 절에 있다.**
#   006 · 025 · 035(부를 발화를 못 정했다) · 009 · 028(배선이 hasPledges 를
#   못 보낸다) · 039(040 과 갈릴 근거가 없다) · 007 · 051(web.search 권한) ·
#   011 · 023 · 030 · 043(지방선거 데이터 미적재).
#   **필요 없어서가 아니라 지금 되는 발화부터 세우려고 미룬 것이다.**
#
# ★ **004 는 지우려다 되살렸다.** 나머지 열둘과 성격이 다르다 — 명령은 나가고
#   배선도 온톨로지도 멀쩡하며 KRRI_ASAP 화면이 안 받을 뿐이다. 게다가 지우면
