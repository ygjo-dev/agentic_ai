# ★ 2026-09-03 「아흔셋째」 — **여기부터 아래 표가 옛 서른여섯을 대신한다.**
#
# **왜 갈아 끼웠나.** 옛 서른여섯은 recipe 쉰셋 중 스물일곱만 지났고, 그중
# 여럿이 여러 recipe 에 똑같이 맞는 애매한 말이었다. 「아흔두째」가 menu 쉰셋을
# 사용자 말로 다시 쓴 뒤에도 26/36 에서 멈춘 까닭의 절반이 자에 있었다 —
# **재는 자가 recipe 를 반도 안 덮고, 덮은 자리도 하나를 집어 부르지 못했다.**
# 그래서 recipe 하나에 발화 하나를 매기는 표로 통째로 바꿨다.
#
# ★ **이 표의 숫자를 옛 서른여섯의 숫자(맨몸 26/36 등)와 견주지 마라.**
# 발화가 다르고 개수가 다르다. 오늘부터 이 표가 기준선이다.
#
# ★ **넣지 않은 것 — recipe 는 살아 있는데 표에 없는 여섯.**
# 부를 수는 있는데 **반드시 0건**이라 어떤 발화로도 못 맞히는 자리다. 자에
# 넣으면 영영 못 맞히고, 붙어 나오는 다른 recipe 의 답까지 뺏는다.
#
#   007 · 051   web.search 가 권한에 막혀 있다. 051 은 배선도 없다
#               (check_wiring C 1 · web_fetch×web_address)
#   011 · 023   2026 지방선거 데이터가 미적재다 (dataset.available false).
#   030 · 043   부르면 반드시 0건이다
#
# ★ **여섯은 「필요 없어서」가 아니라 「지금 되는 발화부터 세우려고」 미룬
#   것이다. 되살아날 recipe 다.** 되살릴 조건과 되살리는 법 —
#
#   권한이 열리면(007 · 051)      발화를 짓고 이 표에 넣는다
#   데이터가 들어오면(011 · 023 · 030 · 043)   같다
#
#   ★ 이 여섯을 지우지 않은 것도 그래서다. menu 에도 recipe 파일에도 그대로
#     있고, 빠진 것은 이 표뿐이다. 「열린 과제」에 같은 내용이 있다.
#
# ★ **지운 둘 — 037 · 044.** 표에서 뺀 것이 아니라 recipe 를 지웠다.
#   037 은 003 과, 044 는 043 과 사용자에게 같은 일이라 어떤 자연스러운 말도
#   둘을 못 갈랐다. 까닭과 되살리는 법은 NOTES.md 「열린 과제」에 있고
#   원본은 태그 `before-answer-table` 에 있다. **번호는 다시 안 매겼다.**
#
# ★ **묶음 셋의 뜻이 바뀌었다.** 옛 셋(기준선 아홉 · 확장 스물둘 · 화면
#   다섯)은 「언제 만든 자인가」로 갈랐다. 새 셋은 **시작 데이터**로 가른다 —
#   말한 것 · 찍은 지점 · 보이는 범위. 만든 날이 하나뿐이라 옛 기준이 뜻을
#   잃었고, 시작 데이터는 **잴 수 있는 조건**을 가르기 때문이다 (뒤의 둘은
#   지도 문맥이 와야 닿는다). 경계값은 BASELINE_LAST · EXTENSION_LAST 다.
#
# ★ **지명·노선명·선거구명은 지어내지 않았다.** 2026-09-03 에 Gateway
#   (`/api/tools/execute`)를 눌러 확인한 것만 썼다. 무엇을 어떻게 눌렀는지는
#   NOTES.md 「아흔셋째」의 「이름을 어떻게 확인했나」 표에 있다. 눌러 보고
#   버린 값도 거기 있다 (청주역 0건 · 환경/복지 공약 0건 · 급속 0건).
#
# ★ **기대값은 한 recipe 다.** 여럿이 맞는 발화는 이번에 안 만들었다.
#   그래도 하나로 못 좁힌 자리는 그 줄 옆에 「함께 걸림」으로 적었다 —
#   **지금 상태를 적중으로 만들려고 기대값을 늘리지 않는다.**
