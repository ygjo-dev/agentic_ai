# False-positive 방어 테스트 (test_suite_adversarial_v1) — 지원 기능과 닮았지만 넘어서는 요청.
#
# 테스트 세트 v2 를 대신하지 않는 보조 자다. v1(FULL48) · v2 의 발화 · 기대값 · 기준 벤치마크는
# 그대로 두고, 이 파일은 따로 잰다. 세 자의 점수를 한 백분율로 합치지 않는다.
#
# 읽는 곳은 dev/evaluation/engine/load_test_suite.py 하나다. **데이터 파일이다. yaml.dump 로 다시 쓰지 않는다.**
#
# ── 무엇을 재나 ─────────────────────────────────────────────────────
#
# 받아들인 recipe 서른아홉마다 발화 하나. 그 recipe 와 아주 가까워 보이지만 그 도구가 실제로
# 내놓지 못하는 능력(영상 분석 · 예측 · 예약 · 결제 · 전송 · 편집 · 저장 · 없는 자료 · 판정)을
# 요구한다. 서른아홉 중 어느 기능을 골라도 요청한 일을 못 하므로 정답은 NO_MATCH 하나다.
# 고르면 false positive 다.
#
#   입력이 빠진 요청이 아니다     장소 · 지점 · 화면 · 이름은 발화나 문맥에 다 있다
#   되묻기가 정답인 요청이 아니다  후보 둘 사이에서 망설일 일이 아니다
#   다른 기능으로 풀리는 요청이 아니다
#
# 짜임은 판 2 그대로다. 묶음 선언 넷을 똑같이 두고 case 는 전부 범위 밖(out_of_scope)이다.
# 채점은 기존 범위 밖 채점(score)을 그대로 쓴다.
#
# case 마다 사람이 정답표를 검토하려고 두는 칸 둘. 점수에는 안 쓴다.
#   adversarial_for   어느 recipe 를 유혹하는 발화인가. 서른아홉이 겹치지 않고 받아들인 recipe 전부다
#   rationale         그 recipe 가 하는 일과 이 요청이 넘어서는 지점
#
# 발화는 v1 · v2 · menu example 과 글자까지 같지 않고, recipe id · 도구 이름을 담지 않는다
# (dev/tests/evaluation/test_test_suite_integrity.py 가 본다).

