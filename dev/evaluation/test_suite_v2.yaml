# 테스트 세트 v2 (Test Suite v2) — 일반화를 재는 넓은 정답표.
#
# FULL48(resolve_regression.yaml)은 얼린 회귀 기준선이고 이 파일은 그것을 대신하지 않는다.
#   FULL48         알려진 발화의 회귀를 잡는다. 발화 · 기대값을 바꾸지 않는다
#   테스트 세트 v2  같은 기능을 다른 말로 불러도 닿는지, 범위 밖을 범위 밖으로 받는지 잰다
# 두 자의 점수를 한 백분율로 합치지 않는다. 발화가 다르면 다른 자다.
#
# 읽는 곳은 dev/evaluation/suite.py 하나다. **데이터 파일이다. yaml.dump 로 다시 쓰지 않는다.**
#
# ── 짜임 ────────────────────────────────────────────────────────────
#
# 범위 안   받아들인 recipe 서른아홉 전부에 발화 다섯씩. 묶음은 FULL48 과 같은 뜻 —
#           시작 데이터(말한 것 · 찍은 지점 · 보이는 범위)로 가른다. recipe 의 묶음은
#           그 execution 이 화면 문맥 무엇을 읽는가로 정해지고 spoken_audit._selfcheck 가 본다
# 범위 밖   기대 recipe 가 없다. expected.category 가 갈래, expected.outcomes 가 받아들이는 결과
#             unsupported   menu 의 어느 기능도 하는 일이 아니다          -> NO_MATCH
#             ambiguous     방식만 다른 기능이 여럿 맞는다                 -> CLARIFY
#             insufficient  기능은 서는데 부를 값을 말하지 않았다          -> CLARIFY 또는
#                           고른 기능의 workflow 가 MISSING_ARGUMENT
#           결과 이름은 지어내지 않았다. resolve 응답 schema 의 status enum 과
#           workflow_materializer 의 판정 이름이다
#
# ── 정답 규칙 (FULL48 과 같다) ─────────────────────────────────────
#
# 기대 recipe 의 Recipe.execution 이 `{from: spoken.<이름>}` 으로 읽는 칸만 적는다.
# 읽는데 발화가 말하지 않은 칸은 null 이다. 안 읽는 칸은 적지 않는다.
#   argument     검색 대상 · 장소 · 식별자. 발화에 있는 말 그대로, 조사와 요청하는 말은 뗀다
#   admin_level  이름 있는 행정구역이면 그 실제 층위, 층위를 묻는 말이면 그 층위.
#                역 · 시설 · 지시어(여기 · 화면)는 null. 기본값과 실행이 같아도 null 을 봐주지 않는다
#   travel_mode  도보 · 자전거 · 승용차 · 대중교통. 말하지 않았으면 null
#   minutes      정수 목록. 말하지 않았으면 null
#
# ── 발화를 지은 법 ──────────────────────────────────────────────────
#
# 한 기능의 다섯은 낱말 · 어순 · 말투(짧게 · 대화처럼)가 서로 다르다. 조사 · 어미만 바꾼
# 다섯을 두지 않았다. FULL48 발화 · menu example · resolve prompt 의 예시 문장을 옮기지
# 않았다(spoken_audit._selfcheck 가 본다). recipe id · 도구 이름을 발화에 넣지 않았다.
# ★ **지명 · 선거구명 · 기관명은 Gateway 로 눌러 확인한 값이 아니다.** 이 자는 고르기와
#   뽑기를 재고 MCP 도구를 부르지 않는다. 실행에서 0건이 나는지는 이 자가 안 본다.

version: 2
name: "test_suite_v2"

groups:
  - id: spoken
    label: "말한 것"
  - id: picked_point
    label: "찍은 지점"
  - id: view_extent
    label: "보이는 범위"
  - id: out_of_scope
    label: "범위 밖"

