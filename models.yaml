# 모델별 값. 왜 이 값인지는 NOTES.md 의 「건드리기 전에 읽을 것」 에 있다.
#
# num_ctx 32768 은 모델 크기만 갈라 재려고 모든 모델에 같게 둔 값이다.
# 이 장비는 VRAM 95GB x4 라 여유가 있다.
#
# 목록에 없는 모델도 --model 로 부를 수 있다. 그때는 defaults 를 그대로 쓴다.
# 서버를 띄운 채로 고쳐도 다음 요청부터 반영된다.
#
# provider 는 지금 배포에서 그 모델을 어느 backend 로 부르는가다. 모델마다
# 적는 설정이고, 적지 않으면 defaults 의 ollama 다.
# ★ 어디에 붙는가(OLLAMA_HOST · VLLM_HOST)는 기계마다 다르므로 .env 에 있다.

# 기본 모델. 환경변수 LLM_MODEL 이 있으면 그것이 이긴다.
# ★ 2026-09-06 에 qwen3:32b 에서 옮겼다 — Solar 가 35/36 · 실패 1 로 qwen(34/36 ·
#   실패 2)보다 낫고, 같은 로드에서도 새 로드에서도 세 판이 한 칸도 안 달랐다.
default: "solar-open2-250b"

defaults:
  provider: ollama
  num_ctx: 32768
  timeout: 180
  reason_max_length: 200

models:
  "qwen3:14b":
    timeout: 300
  "qwen3:32b":
    timeout: 900

  # Solar Open2 250B NVFP4. Ollama 가 아니라 vLLM 서버에 붙는다.
  # ★ 서버가 --no-enable-flashinfer-autotune 으로 떠 있어야 같은 발화가 같은
  #   답을 낸다 (2026-09-05 실측). 그것은 서버 기동 옵션이라 여기 없다.
  "solar-open2-250b":
    provider: vllm
