# 모델별 값. 왜 이 값인지는 NOTES.md 의 「건드리기 전에 읽을 것」 에 있다.
#
# num_ctx 32768 은 모델 크기만 갈라 재려고 모든 모델에 같게 둔 값이다.
# 8192 는 Windows 장비의 메모리 제약이었고 이 장비는 VRAM 95GB x4 라 여유가 있다.
#
# 목록에 없는 모델도 --model 로 부를 수 있다. 그때는 defaults 를 그대로 쓴다.
# 서버를 띄운 채로 고쳐도 다음 요청부터 반영된다.

default: "qwen3:8b"

defaults:
  num_ctx: 32768
  timeout: 180
  reason_max_length: 200

models:
  "qwen3:14b":
    timeout: 300
  "qwen3:32b":
    timeout: 900
