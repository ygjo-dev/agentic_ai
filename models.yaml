# 모델별 값. 왜 이 값인지는 NOTES.md 의 「건드리기 전에 읽을 것」 에 있다.
#
# num_ctx 32768 은 모델 크기만 갈라 재려고 모든 모델에 같게 둔 값이다.
# 이 장비는 VRAM 95GB x4 라 여유가 있다.
#
# 목록에 없는 모델도 --model 로 부를 수 있다. 그때는 defaults 를 그대로 쓴다.
# 서버를 띄운 채로 고쳐도 다음 요청부터 반영된다.
#
# ★ 아래 defaults 는 **모델 설정의 공통값**이지 기본 모델이 아니다. 어느 모델을
#   부를지는 역할이 정한다.
#
# provider 는 지금 배포에서 그 모델을 어느 backend 로 부르는가다. 모델마다
# 적는 설정이고, 적지 않으면 defaults 의 ollama 다.
# ★ 어디에 붙는가(OLLAMA_URL · VLLM_URL)는 기계마다 다르므로 .env 에 있다.

# 애플리케이션이 LLM 을 부르는 목적. **역할이 모델 이름이 아니다** —
# 역할은 「왜 부르는가」이고 모델은 「무엇으로 부르는가」다. 둘을 한 이름으로
# 쓰면 모델을 바꿀 때 부르는 쪽의 뜻까지 바뀐 것처럼 읽힌다.
#
#   역할 → (model) → 물리 모델 → provider → provider client
#   역할 → prompt
#
# prompt 는 저장소 뿌리에서 본 경로다. **역할이 프롬프트의 주인이다** — 예전에는
# paths.py 상수와 부르는 코드에 나뉘어 있어 어느 역할이 무엇을 쓰는지 이 파일만
# 봐서는 알 수 없었다.
#
# **역할마다 model 을 적는다. 안 적으면 오류다.** 전역 기본 모델을 두지 않는다 —
# 한 줄을 고치면 모든 목적이 함께 움직여서, 어느 역할을 무엇으로 재고 있는지
# 파일만 보고는 알 수 없었다. 적는 이름은 아래 models 목록에 있어야 한다.
roles:
  # 발화 → recipe 선택. 같은 응답에서 발화가 말한 값도 함께 뽑는다.
  # ★ LLM 호출은 한 번이다. 고르기와 뽑기를 두 번으로 나누지 않는다.
  # ★ 2026-09-06 에 qwen3:32b 에서 옮겼다 — Solar 가 35/36 · 실패 1 로
  #   qwen(34/36 · 실패 2)보다 낫고, 같은 로드에서도 새 로드에서도 세 판이
  #   한 칸도 안 달랐다.
  resolve:
    model: solar-open2-250b
    prompt: workflows/static/prompts/recipe_selection.md

  # 사람이 쓴 노드 정보 → node_id 와 관한 대상.
  # resolve 와 목적도 프롬프트도 다르므로 한 역할로 합치지 않는다.
  node_registration:
    model: "qwen3:32b"
    prompt: registration/node_registration.md

defaults:
  provider: ollama
  num_ctx: 32768
  timeout: 180
  reason_max_length: 200

models:
  "qwen3:14b":
    timeout: 300
  "qwen3:32b":
    timeout: 900

  # Solar Open2 250B NVFP4. Ollama 가 아니라 vLLM 서버에 붙는다.
  # ★ 서버가 --no-enable-flashinfer-autotune 으로 떠 있어야 같은 발화가 같은
  #   답을 낸다 (2026-09-05 실측). 그것은 서버 기동 옵션이라 여기 없다.
  "solar-open2-250b":
    provider: vllm
