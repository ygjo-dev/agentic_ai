steps:

  - node: place_name

  - node: geocode_place

  - node: plan_trip

execution:

  spoken_needed: true

  context_needs:
    point: {from: context.selectedLocation, fields: {lon: lon, lat: lat}}

  workflow:

    - id: s1
      node: geocode_place
      server_id: asap-mcp-core
      tool: geo.geocode
      input:
        query: {from: spoken.argument}
      outputs:
        point: {fields: {lon: location.0, lat: location.1}}

    - id: s2
      node: plan_trip
      server_id: otp-router
      tool: otp_plan_trip
      input:
        from_lat: {from: context.point.lat}
        from_lon: {from: context.point.lon}
        to_lat: {from: s1.point.lat}
        to_lon: {from: s1.point.lon}
        date: {from: runtime.now.date}
        time_kst: {from: runtime.now.time}
