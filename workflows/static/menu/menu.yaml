version: 1.0

recipes:

  recipe_001:
    function: 오송역처럼 장소 이름을 말하면, 그곳이 지도 어디인지 위경도 좌표로 짚어 준다. 좌표까지만 주고 끝낸다.
    example: 천안역 위치 위경도로 짚어줘

  recipe_002:
    function: 경부선처럼 철도 구간 이름을 말하면, 그 구간 선로가 어떻게 놓였는지 선형 좌표만 준다. 노선 목록도 역 목록도 안 준다.

  recipe_003:
    function: 어떤 철도 노선이 지나는지 알고 싶을 때. 오송역처럼 역 이름이나 경부선처럼 노선 이름을 말하면, 그 이름으로 철도 노선과 역을 조회해 알려준다.
    example: 대전역에 어떤 철도 노선이 들어와

  recipe_004:
    function: 오송 테스트트랙의 터널·교량·선로처럼 시설물 이름을 말하면, 그것을 디지털 트윈 화면에 띄워 보여준다.

  recipe_005:
    function: 청주시처럼 행정구역 이름이나 코드를 그대로 대면, 그 행정경계를 이름·코드·레이어로 조회해 준다.
    example: 논산시 경계 그려줘

  recipe_008:
    function: 청주처럼 지역 이름이나 시도 약칭, 코드를 대면, 거기 제22대 국회의원 선거구가 무엇무엇인지 이름으로 목록을 뽑는다.
    example: 대전 지역구 목록 뽑아줘

  recipe_010:
    function: 청주나 민주당처럼 지역·당선인·정당을 대면, 제22대 국회의원이 내건 공약 자체를 검색해 보여준다.
    example: 대중교통 공약 내놓은 의원 모아줘

  recipe_012:
    function: 사람이 몇 명이나 사는지 알고 싶을 때. 시군구처럼 지역 단위나 이름, 코드를 대면, 지역별 인구 수와 순위를 집계해 낸다.
    example: 시군구별 인구 순위 매겨줘

  recipe_013:
    function: 전기차 충전소를 이름·주소·운영기관이나 충전기 유형으로 검색해 어디 있는지 목록을 낸다. 충전기가 몇 대 비었는지는 안 본다.

  recipe_014:
    function: 철도안전법처럼 문서 이름이나 그 안에 나올 말을 대면, 지식베이스에 든 문서 본문에서 찾아 준다.
    example: 산업안전보건법 조문 원문 보여줘

  recipe_015:
    function: 충북 청주서원처럼 선거구 이름이나 선거구 코드를 집어 말하면, 그 제22대 국회의원 선거구 한 곳을 조회해 준다.
    example: 대전 서구갑 선거구 정보 줘

  recipe_016:
    function: 청주시 흥덕구처럼 행정구역 이름이나 선거구 코드를 집어 말하면, 그 제22대 국회의원 선거구 한 곳을 당선인·정당·공약까지 붙여 조회해 준다.

  recipe_018:
    function: 「여기」·「이 위치」·「선택한 위치」라고 하면 그 자리가 어느 시·군·구·동인지와 행정구역 코드를 알려준다.

  recipe_019:
    function: 「여기」·「이 위치」·「선택한 위치」라고 하면 그 자리 둘레에 있는 CCTV 를 보여준다.
    example: 이 위치 둘레 CCTV 보여줘

  recipe_020:
    function: 「여기」·「이 위치」·「선택한 위치」라고 하면 그 자리가 무슨 제22대 국회의원 선거구에 드는지 선거구 이름만 알려준다.

  recipe_021:
    function: 「여기」·「이 위치」·「선택한 위치」라고 하면 그 자리 제22대 국회의원 선거구의 당선인이 누구고 어느 정당인지 공약 집계까지 알려준다.
    example: 선택한 위치 당선인이랑 정당 알려줘

  recipe_022:
    function: 「여기」·「이 위치」·「선택한 위치」라고 하면 그 자리 제22대 국회의원 선거구가 내건 공약을 분야로 걸러 보여준다.
    example: 이 위치 선거구가 내건 공약 쭉 보여줘

  recipe_024:
    function: 「지금 보이는 곳」·「현재 화면」이라고 하면 그 화면에 걸친 행정구역 경계를 이름·코드·레이어로 조회해 준다.
    example: 지금 화면에 든 시군구 경계선 표시해줘

  recipe_026:
    function: 「지금 보이는 곳」·「현재 화면」이라고 하면 그 화면 안에 있는 CCTV 를 보여준다.
    example: 현재 화면에 걸린 CCTV 전부 띄워줘

  recipe_027:
    function: 「지금 보이는 곳」·「현재 화면」이라고 하면 그 화면에 걸친 철도 노선과 역을 조회해 알려준다.

  recipe_029:
    function: 「지금 보이는 곳」·「현재 화면」이라고 하면 그 화면에 걸친 제22대 국회의원 공약을 당선인·정당·분야로 검색한다.
    example: 현재 화면 안 국민의힘 공약 검색해줘

  recipe_031:
    function: 「지금 보이는 곳」·「현재 화면」이라고 하면 그 화면 안에 사람이 몇 명이나 사는지 인구 수와 순위를 낸다.

  recipe_032:
    function: 「지금 보이는 곳」·「현재 화면」이라고 하면 그 화면 안에 전기차 충전소가 어디 있는지 찾아 준다. 충전기가 몇 대 비었는지는 안 본다.

  recipe_033:
    function: 오송역처럼 행정구역이 아닌 곳을 말하면, 그 자리 둘레의 행정구역 경계를 이름·코드·레이어로 조회해 준다.
    example: 수원역 둘레 행정구역 경계 띄워줘

  recipe_034:
    function: 오송역처럼 장소 이름을 말하면, 그곳이 어느 시·군·구·동인지와 행정구역 코드를 알려준다.
    example: 서대전역이 어느 동에 속하는지 알려줘

  recipe_036:
    function: 오송역처럼 장소 이름을 말하면, 그 자리 둘레에 있는 CCTV 를 보여준다.

  recipe_038:
    function: 오송역처럼 장소 이름을 말하면, 그곳이 무슨 제22대 국회의원 선거구에 드는지 선거구 이름만 알려준다.
    example: 대전역은 무슨 선거구에 들어가

  recipe_040:
    function: 오송역처럼 장소 이름을 말하면, 그곳 제22대 국회의원 선거구의 당선인이 누구고 어느 정당인지 공약 집계까지 알려준다.
    example: 대전역 쪽 당선인이 누구지

  recipe_042:
    function: 오송역처럼 장소 이름을 말하면, 그곳 제22대 국회의원 선거구가 내건 공약을 분야로 걸러 보여준다.
    example: 대전역 지역 의원 공약 좀 훑어줘

  recipe_045:
    function: 오송역처럼 장소 이름을 말하면, 그 둘레에 사람이 몇 명이나 사는지 인구 수와 순위를 낸다.
    example: 대전역 주변에 사람 몇 명이나 사나

  recipe_046:
    function: 오송역처럼 장소 이름을 말하면, 그 옆에 전기차 충전소가 어디 있는지 찾아 준다. 충전기가 몇 대 비었는지는 안 본다.
    example: 대전역 옆에 전기차 충전소 어디 있어

  recipe_049:
    function: 경부선처럼 철도 노선이나 구간 이름을 말하면, 그 선로를 따라가며 CCTV 를 보여준다.
    example: 호남선 선로 따라 CCTV 띄워줘

  recipe_052:
    function: 전기차 충전소를 이름·주소·운영기관으로 검색한 다음, 그 충전소의 충전기가 몇 대 비어 있는지까지 자세히 알려준다.
    example: 한국전력 충전소 충전기 몇 대 남았는지까지 알려줘

  recipe_054:
    function: 「여기」·「이 위치」·「선택한 위치」라고 하면 그 자리 행정구역의 연령대별 남녀 인구 구성을 알려준다.
    example: 선택한 위치 나이대별 인구 구성 줘

  recipe_055:
    function: 「여기」·「이 위치」·「선택한 위치」라고 하면 그 자리 행정구역에서 달마다 인구가 얼마나 늘고 줄었는지 알려준다.

  recipe_056:
    function: 「지금 보이는 곳」·「현재 화면」이라고 하면 그 화면 안 전기차 충전소를 찾아 충전기가 몇 대 비어 있는지까지 자세히 알려준다.

  recipe_058:
    function: 오송역처럼 장소 이름을 말하면, 그곳 행정구역의 연령대별 남녀 인구 구성을 알려준다.

  recipe_059:
    function: 오송역처럼 장소 이름을 말하면, 그곳 행정구역에서 달마다 인구가 얼마나 늘고 줄었는지 알려준다.
    example: 부산역 일대 인구 달마다 얼마나 늘었어

  recipe_060:
    function: 오송역처럼 장소 이름을 말하면, 그 옆 전기차 충전소를 찾아 충전기가 몇 대 비어 있는지까지 자세히 알려준다.
    example: 대전역 옆 충전소 충전기 몇 개 비었는지까지 줘
