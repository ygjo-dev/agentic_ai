steps:

  - node: keyword

  - node: search_ev_stations

  - node: get_ev_station

example: 한국전력 충전소 충전기 몇 대 남았는지까지 알려줘

execution:

  spoken_needed: true

  context_needs: {}

  workflow:

    - id: s1
      node: search_ev_stations
      server_id: asap-mcp-core
      tool: ev.searchStations
      input:
        query: {from: spoken.argument}
      outputs:
        station_id: {value: items.0.stationId}

    - id: s2
      node: get_ev_station
      server_id: asap-mcp-core
      tool: ev.getStation
      input:
        statId: {from: s1.station_id}
